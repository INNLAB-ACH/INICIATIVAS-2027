<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>A2 · Pago desde la app del comercio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0D1B2A;--blue:#005FA3;--blue-d:#004A80;--blue-l:#A8C4D8;--bg:#F3F6F9;
  --ink:#0D1B2A;--muted:#4A5A6A;--line:#D5E0EA;--field:#7D8E9F;
  --ok:#1E7A46;--ok-bg:#E3F1E8;--err:#B3261E;--err-bg:#FCE9E7;--warn:#7A4F00;--warn-bg:#FDF0D5;
  --bank:#1E5E5A;--bank-d:#164845;--bank-l:#E4F0EF;
  --hf:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:#DCE4EC;font-family:'Source Sans 3',system-ui,sans-serif;color:var(--ink);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--hf);margin:0;line-height:1.2}
h1{font-weight:800;font-size:23px;margin:4px 0 12px}
h1:focus{outline:none}
h2{font-weight:700;font-size:17px;margin:0 0 10px}
h3{font-weight:700;font-size:15px;margin:16px 0 8px}
p{margin:0 0 10px}
button,input,select{font-family:inherit;font-size:16px;color:inherit}
:focus-visible{outline:3px solid var(--blue-d);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Escenario y marco */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.phone{width:390px;height:844px;background:var(--bg);border-radius:46px;box-shadow:0 0 0 11px var(--navy),0 24px 70px rgba(13,27,42,.3);overflow:hidden;position:relative;display:flex;flex-direction:column}
@media (max-width:520px),(max-height:700px) and (max-width:900px){
  .stage{padding:0;min-height:100dvh}
  .phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
}
.band{flex:none;background:var(--navy);color:#fff;font-size:12.5px;text-align:center;padding:14px 8px 7px;letter-spacing:.02em;user-select:none}
@media (max-width:520px){.band{padding-top:max(7px,env(safe-area-inset-top))}}
.screen{flex:1;overflow-y:auto;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch;position:relative}
.homebar{flex:none;height:30px;min-height:30px;border:0;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0 0 env(safe-area-inset-bottom);position:relative}
.homebar::before{content:"";position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:180px;height:44px}
.homebar span{width:134px;height:5px;border-radius:3px;background:var(--navy)}
.phone.on-home .homebar{background:var(--navy)}
.phone.on-home .homebar span{background:#fff}

/* Barras */
.appbar{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px;min-height:58px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.appbar.bank{background:var(--bank);color:#fff;border-bottom:0}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--hf);font-weight:800;font-size:16px;flex:1;min-width:0}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{min-width:44px;height:44px;border:0;background:transparent;border-radius:10px;cursor:pointer;color:inherit;display:flex;align-items:center;gap:2px;padding:0 8px 0 2px;font-weight:600;font-size:15px;flex:none}
.back:hover{background:rgba(0,95,163,.08)}
.appbar.bank .back:hover{background:rgba(255,255,255,.12)}
.back-sp{width:4px}
.prof{min-width:44px;height:44px;border:0;background:transparent;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:4px;padding:0 8px;font-weight:600;font-size:14px;color:var(--blue-d);flex:none}
.prof:hover{background:#EDF2F6}
.mark{width:32px;height:32px;border-radius:9px;background:var(--navy);display:grid;place-items:center;flex:none}
.bmark{width:30px;height:30px;border-radius:8px;background:#fff;color:var(--bank);display:grid;place-items:center;font-family:var(--hf);font-weight:800;font-size:15px;flex:none}
.urlbar{font-size:12.5px;color:var(--muted);background:#EDF2F6;padding:5px 12px;display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--line)}

/* Contenido */
.content{padding:18px 16px 20px;flex:1}
.footer{position:sticky;bottom:0;padding:12px 16px 14px;background:#fff;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;z-index:4}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid #EDF2F6}
.row:last-child{border-bottom:0}
.row .k{color:var(--muted)}
.row .v{text-align:right;font-weight:600}
.row .v.strong{font-family:var(--hf);font-weight:800}
.muted{color:var(--muted)}
.small{font-size:14px}
.amount{font-family:var(--hf);font-weight:800;font-size:28px;letter-spacing:-.01em}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 0 8px}
.grow{flex:1;min-width:0}
.notice{background:#EAF2F8;border:1px solid var(--blue-l);border-radius:12px;padding:10px 12px;font-size:15px;margin-bottom:14px}
.notice.warn{background:var(--warn-bg);border-color:#E9C98A;color:#3D2A00}
.datechip{display:inline-block;background:var(--navy);color:#fff;border-radius:20px;padding:4px 12px;font-size:13.5px;font-weight:600;margin-bottom:8px}
.item{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #EDF2F6;font-size:15px}
.item:last-child{border-bottom:0}
.item .q{color:var(--muted);font-size:13.5px;display:block}
.item .p{font-weight:600;white-space:nowrap}
.totrow{display:flex;justify-content:space-between;align-items:center;padding-top:8px}
.tokenbox{display:flex;gap:10px;align-items:flex-start;background:var(--ok-bg);border:1px solid #A9D3B8;border-radius:12px;padding:10px 12px;margin-bottom:12px}
.footer .tokenbox{margin-bottom:0;padding:8px 12px}
.tokenbox svg{flex:none;margin-top:2px}
.tokenbox .link{min-height:32px;padding:0;margin-left:2px}
.pm{display:flex;align-items:center;gap:12px}
.bankstrip{display:flex;gap:10px;align-items:center;background:var(--bank-l);border:1px solid #B8D6D3;border-radius:12px;padding:10px 12px;margin-bottom:14px}
.bankstrip .bmark{background:var(--bank);color:#fff}
.bankstrip strong{display:block;font-family:var(--hf);font-size:15px}
.bankstrip span.d{display:block;font-size:13.5px;color:var(--muted)}
.chip{display:inline-block;font-size:12.5px;font-weight:700;border-radius:20px;padding:2px 10px;margin-top:3px}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.off{background:#EDF2F6;color:var(--muted)}
.auth-h{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.auth-h strong{display:block;font-family:var(--hf);font-size:16px}
.mlogo{width:40px;height:40px;border-radius:10px;background:var(--navy);display:grid;place-items:center;flex:none}
.mlogo.t{background:#5B4A8B;color:#fff;font-family:var(--hf);font-weight:800;font-size:14px}
.menu{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.menu button{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:54px;border:0;border-bottom:1px solid #EDF2F6;background:#fff;text-align:left;cursor:pointer;padding:6px 16px;font-weight:600;font-size:16px}
.menu button:last-child{border-bottom:0}
.menu button:hover{background:#F5F9FC}
.menu button .d{display:block;font-weight:400;font-size:13.5px;color:var(--muted)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.qa button{min-height:76px;border:1px solid var(--line);background:#fff;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;padding:10px 14px;font-weight:600;font-size:15px;text-align:left;color:var(--ink)}
.qa button:hover{border-color:var(--bank)}
.qa svg{color:var(--bank)}
.acct{background:var(--bank);color:#fff;border-radius:16px;padding:16px}
.acct .muted{color:#CFE3E1}
.mov{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #EDF2F6;font-size:15px}
.mov:last-child{border-bottom:0}
.mov .d{display:block;font-size:13px;color:var(--muted)}
.mov .neg{font-weight:700;white-space:nowrap}
.mov .pos{font-weight:700;color:var(--ok);white-space:nowrap}

/* Inicio del celular */
.home{flex:1;background:var(--navy);color:#fff;padding:26px 22px;display:flex;flex-direction:column}
.clock{font-family:var(--hf);font-weight:800;font-size:56px;text-align:center;margin-top:18px;line-height:1}
.hdate{text-align:center;color:#C9D7E3;margin:6px 0 34px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px}
.app{border:0;background:transparent;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;min-height:44px;padding:4px 0;border-radius:12px}
.app .ic{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;background:#2A3A4C}
.app.ma .ic{background:#fff}
.app.ba .ic{background:var(--bank)}
.app.dim .ic{background:#223244}
.hint-home{margin-top:auto;text-align:center;color:#C9D7E3;font-size:14px}

/* Botones */
.btn{min-height:50px;border-radius:12px;font-family:var(--hf);font-weight:700;font-size:16px;border:0;cursor:pointer;width:100%;padding:0 16px}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-d)}
.btn-bank{background:var(--bank);color:#fff}
.btn-bank:hover{background:var(--bank-d)}
.btn-secondary{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.btn-secondary:hover{background:#EAF2F8}
.btn-danger{background:var(--err);color:#fff}
.btn-danger:hover{background:#8E1D17}
.btn-revoke{background:#fff;color:var(--err);border:2px solid var(--err);margin-top:10px}
.btn-revoke:hover{background:var(--err-bg)}
.btn.sm{min-height:44px;width:auto;font-size:14px}
.link{background:none;border:0;color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:44px;cursor:pointer;padding:0 2px;font-size:15px}
.iconbtn{width:44px;height:44px;border:0;background:transparent;border-radius:10px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:#EDF2F6}

/* Formularios */
label{font-weight:600;display:block;margin:16px 0 6px}
fieldset{border:0;padding:0;margin:14px 0 0}
legend{font-weight:600;margin-bottom:8px;padding:0}
input[type=text],input[type=password]{width:100%;min-height:50px;border:1.5px solid var(--field);border-radius:10px;padding:0 12px;background:#fff}
input[aria-invalid=true]{border-color:var(--err);border-width:2px}
.hint{font-size:14px;color:var(--muted);margin-top:5px}
.err{color:var(--err);font-size:14.5px;margin-top:6px;font-weight:600}
.err:empty{display:none}
label.opt{display:flex;align-items:flex-start;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:12px;min-height:50px;margin:0 0 8px;cursor:pointer;background:#fff;font-weight:600}
label.opt:has(input:checked){border-color:var(--blue);background:#F5F9FC}
label.opt input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--blue);flex:none}
label.opt .d{display:block;font-weight:400;color:var(--muted);font-size:14px}
label.opt.remember{font-weight:400;margin-top:4px}

/* Superposiciones */
.overlay{position:absolute;inset:0;background:rgba(243,246,249,.97);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px}
.overlay.dark{background:var(--navy);color:#fff}
.overlay.dark .muted{color:#C9D7E3}
.ov-t{font-family:var(--hf);font-weight:800;font-size:19px;margin:16px 0 6px}
.overlay .btn{max-width:320px;margin-top:14px}
.spinner{width:46px;height:46px;border-radius:50%;border:4px solid var(--blue-l);border-top-color:var(--blue);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fp{color:var(--bank)}
.fp path{stroke-dasharray:70;stroke-dashoffset:70;animation:draw 1.3s ease forwards}
.fp path:nth-child(2){animation-delay:.1s}.fp path:nth-child(3){animation-delay:.2s}.fp path:nth-child(4){animation-delay:.3s}.fp path:nth-child(5){animation-delay:.15s}.fp path:nth-child(6){animation-delay:.25s}
@keyframes draw{to{stroke-dashoffset:0}}
.fp-ring{width:132px;height:132px;border-radius:50%;background:#fff;border:2px solid #B8D6D3;display:grid;place-items:center;position:relative;overflow:hidden}
.fp-ring::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--bank);opacity:.55;top:10%;animation:scan 1.5s ease-in-out}
@keyframes scan{0%{top:10%}50%{top:88%}100%{top:10%}}
#sheetWrap{position:absolute;inset:0;z-index:40}
.backdrop{position:absolute;inset:0;background:rgba(13,27,42,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:#fff;border-radius:20px 20px 0 0;padding:8px 16px 20px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;background:#fff;padding-top:8px;z-index:1}
.sheet-h h2{margin:0}
.sheet ul{padding-left:20px;margin:8px 0 12px}
.sheet li{margin-bottom:8px}
.sheet .btn{margin-top:8px}
.push{position:absolute;top:10px;left:10px;right:10px;background:#fff;border-radius:16px;box-shadow:0 10px 34px rgba(13,27,42,.28);padding:10px 14px 2px;z-index:60;animation:drop .3s ease}
@keyframes drop{from{transform:translateY(-16px);opacity:0}}
.push-h{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);align-items:center}
.push-h strong{display:flex;gap:6px;align-items:center;color:var(--ink)}
.push-h .bmark{width:20px;height:20px;border-radius:5px;background:var(--bank);color:#fff;font-size:11px}
.push p{margin:4px 0 0;font-size:15px}
.toast{position:absolute;left:16px;right:16px;bottom:110px;background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;z-index:70;text-align:center;font-weight:600}

/* Paneles del moderador */
.panel{position:fixed;inset:0;background:rgba(13,27,42,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.pbox{background:#fff;border-radius:16px;width:100%;max-width:600px;max-height:92vh;overflow:auto;padding:16px 20px 20px}
.pbox.wide{max-width:1100px}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.ph h2{margin:0;font-size:19px}
.pbox label.opt{align-items:center;padding:8px 12px}
.jumps{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.jumps button{min-height:44px;border:1.5px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;text-align:left;padding:4px 10px;font-size:14px}
.jumps button:hover{border-color:var(--blue)}
.pactions{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.logt th,.logt td{font-size:12.5px;padding:6px 8px;border-bottom:1px solid #EDF2F6;text-align:left;white-space:nowrap}
.logt td:last-child{white-space:normal;word-break:break-all;min-width:240px}
.logt thead th{position:sticky;top:0;background:#F5F9FC}
.logt-wrap{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
.kbd{font-family:ui-monospace,monospace;background:#EDF2F6;border-radius:5px;padding:1px 6px;font-size:13px}
.state{background:#F5F9FC;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;margin:8px 0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <div class="band" id="band" role="note">Prototipo de investigación · datos ficticios</div>
    <main class="screen" id="screen"></main>
    <button class="homebar" id="homebar" data-act="goHome" aria-label="Ir a la pantalla de inicio del celular"><span aria-hidden="true"></span></button>
    <div id="ov" class="overlay" hidden></div>
    <div id="sheetWrap" hidden><div class="backdrop" data-act="closeSheet"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"></div></div>
    <div id="push" class="push" hidden role="status" aria-live="polite"></div>
    <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
  </div>
</div>
<div id="mod" class="panel" hidden></div>
<div id="logp" class="panel" hidden></div>

<script>
(function(){
'use strict';

/* ---------- Datos del escenario (todo ficticio) ---------- */
var TOPE=300000, DOMI=5900, SALDO_BASE=2504750;
var M={name:'Mercado Aurora',nit:'901.337.205-4'};
var CUENTA='Cuenta de ahorros •••• 4821';
var ORD={
  1:{title:'Tu carrito',ref:'MA-104582',off:0,n:12,items:[
    ['Arroz blanco','5 kg',21900],['Aceite de girasol','3 L',32500],['Huevos AA','30 unidades',18900],['Leche entera','6 × 1,1 L',23400],
    ['Café molido','500 g',16800],['Pechuga de pollo','1 kg',17900],['Plátano verde','5 unidades',6500],['Tomate chonto','1 kg',4900],
    ['Queso campesino','500 g',12300],['Pan tajado','600 g',6900],['Detergente líquido','2 L',14200],['Panela','2 × 500 g',4200]]},
  2:{title:'Tu carrito',ref:'MA-105217',off:7,n:9,items:[
    ['Arroz blanco','5 kg',21900],['Huevos AA','30 unidades',18900],['Leche entera','6 × 1,1 L',23400],['Pechuga de pollo','1 kg',17900],
    ['Pan tajado','600 g',6900],['Tomate chonto','1 kg',4900],['Café molido','500 g',16800],['Frutas surtidas','1,5 kg',14000],['Queso campesino','500 g',12300]]},
  3:{title:'Mercado del mes',ref:'MA-105640',off:10,n:28,items:[
    ['Despensa','11 productos',198400],['Carnes y huevos','6 productos',142300],['Lácteos','5 productos',68900],['Aseo y hogar','6 productos',64500]]}
};
for(var o in ORD){ORD[o].sub=ORD[o].items.reduce(function(a,i){return a+i[2];},0);ORD[o].total=ORD[o].sub+DOMI;}
var CART_ROUTE={1:'p1',2:'p6',3:'c3'};
var SK='a2_pago_app_comercio_estado', LS_KEY='a2_pago_app_comercio_log';

/* ---------- Utilidades ---------- */
function $(s){return document.querySelector(s);}
function money(n){return '$'+String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function pad(n){return String(n).padStart(2,'0');}
function fdate(d){return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();}
function ftime(d){var h=d.getHours(),ap=h<12?'a. m.':'p. m.';h=h%12||12;return h+':'+pad(d.getMinutes())+' '+ap;}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function rnd(n){var s='';for(var i=0;i<n;i++)s+=Math.floor(Math.random()*10);return s.replace(/^0/,'7');}
function dayOff(k){var d=new Date();d.setDate(d.getDate()+k);return d;}
function orderDate(o){return dayOff(ORD[o].off);}

/* ---------- Estado (persiste en la pestaña con sessionStorage) ---------- */
function readQuery(){
  var q=new URLSearchParams(location.search);
  return {v:(q.get('v')||'A').toUpperCase()==='B'?'B':'A',token:q.get('token')==='1'};
}
function freshState(keep){
  var q=readQuery();
  var s={qsig:location.search,variant:q.v,
    token:null,                                         /* autorización de Mercado Aurora */
    tienda:{active:true,created:'03/07/2026',tope:100000,revoked:null}, /* autorización previa (solo en la app del banco) */
    order:1,useToken:true,remember:false,p4from:'p3',authMode:'huella',
    txns:[],last:null,lastMerchant:'p1',perfilFrom:'p1',p7from:'perfil',p7bfrom:'banco',
    forceErr:keep?keep.forceErr:false,failed:{}};
  if(q.token&&q.v==='B')s.token={active:true,created:fdate(new Date()),tope:TOPE,revoked:null};
  return s;
}
var S=null;

function completePayment(mode,created){
  var o=S.order,O=ORD[o],d=orderDate(o);
  S.txns.push({d:'Mercado Aurora · '+O.ref,f:fdate(d),v:O.total});
  S.last={order:o,mode:mode,created:!!created,aprob:rnd(6),date:fdate(d)+' · '+ftime(new Date()),fresh:true};
  if(task.t0&&!task.done){
    task.done=true;
    var det={pedido:o,valor:O.total,modo:mode,ms_total:Date.now()-task.t0,pantallas:task.screens,errores:task.errors,autorizacion:tokenState()};
    log('pago_completado',det);

    if(mode==='tope')log('tope_exito',{ms_total:det.ms_total,errores:task.errors});
  }
  trail=[];  /* la ruta hacia «Revocar» se cuenta desde el último pago */
  save();go('p5');
}
function revoke(c,from){
  var t=c==='ma'?S.token:S.tienda;if(!t||!t.active)return;
  t.active=false;t.revoked=fdate(new Date());
  log('revocar',{comercio:c==='ma'?'Mercado Aurora':'Tienda Aurora',origen:from,ruta:trail.slice(-8).join(' > ')});
  save();render(true);toast('Autorización revocada');
}

  '<button class="btn btn-primary" data-act="modStart" style="margin-top:6px">Aplicar e iniciar</button>'+
  groups.map(function(g){return '<h3>'+g[0]+'</h3><div class="jumps">'+g[1].map(function(k){return '<button data-act="jump" data-r="'+k+'">'+LABELS[k]+' <span class="muted">#'+k+'</span></button>';}).join('')+'</div>';}).join('')+
  '<div class="pactions" style="margin-top:16px"><button class="btn btn-secondary sm" data-act="openLog">Ver registro</button><button class="btn btn-secondary sm" data-act="reset">Reiniciar prototipo</button></div>'+
  '<p class="small muted">Atajos: <span class="kbd">M</span> este panel · <span class="kbd">Shift+L</span> registro · <span class="kbd">Shift+R</span> reiniciar · <span class="kbd">Esc</span> cerrar. En celular: toca 5 veces seguidas la banda superior.</p>'+
  '<p class="small muted">Enlaces directos: <span class="kbd">?v=A</span> · <span class="kbd">?v=B</span> · <span class="kbd">?v=B&amp;token=1#p6</span> (segundo pago con autorización) · <span class="kbd">?v=B&amp;token=1#c3</span> (caso tope) · <span class="kbd">?v=B&amp;token=1#home</span> (revocar)</p></div>';
}
function toggleMod(){var m=$('#mod');if(m.hidden){renderMod();m.hidden=false;var f=m.querySelector('input:checked');if(f)f.focus();}else m.hidden=true;}

/* ---------- Registro (Shift+L) ---------- */
var COLS=['ts','sesion','variante','pantalla','accion','detalle'];
function toCsv(){return [COLS.join(',')].concat(window.__log.map(function(e){return COLS.map(function(c){var v=String(e[c]==null?'':e[c]);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',');})).join('\n');}
function fallbackCopy(t){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');}catch(_){}a.remove();}
function renderLog(){
  var L=window.__log,start=Math.max(0,L.length-600);
  var rows=L.slice(start).map(function(e){return '<tr>'+COLS.map(function(c){return '<td>'+esc(e[c]==null?'':e[c])+'</td>';}).join('')+'</tr>';}).join('');
  $('#logp').innerHTML='<div class="pbox wide" role="dialog" aria-modal="true" aria-labelledby="log-t">'+
  '<div class="ph"><h2 id="log-t">Registro de eventos ('+L.length+')</h2><button class="iconbtn" data-act="closeLog" aria-label="Cerrar">'+I.close+'</button></div>'+
  '<div class="pactions"><button class="btn btn-primary sm" data-act="copyCsv">Copiar CSV</button><button class="btn btn-secondary sm" data-act="dlCsv">Descargar CSV</button><button class="btn btn-secondary sm" data-act="clearLog">Borrar registro</button></div>'+
  '<p id="copyMsg" class="small" role="status" style="color:var(--ok);font-weight:600"></p>'+
  (start?'<p class="small muted">Se muestran los últimos 600 eventos; el CSV incluye todos.</p>':'')+
  '<div class="logt-wrap"><table class="logt"><thead><tr>'+COLS.map(function(c){return '<th scope="col">'+c+'</th>';}).join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  var w=$('#logp .logt-wrap');if(w)w.scrollTop=w.scrollHeight;
}
function toggleLog(force){var p=$('#logp');if(p.hidden||force){renderLog();p.hidden=false;var b=p.querySelector('button');if(b)b.focus();}else p.hidden=true;}

/* ---------- Reinicio (Shift+R) ---------- */
function resetProto(){
  if(task.t0&&!task.done)log('abandono',{motivo:'reinicio',pedido:task.order,ms:Date.now()-task.t0});
  log('reinicio');
  S=freshState(S);SID='S'+Date.now().toString(36).toUpperCase();cur=null;trail=[];task={t0:0,order:0,screens:0,errors:0,done:true};
  try{sessionStorage.removeItem(SK);}catch(_){}
  $('#mod').hidden=true;$('#logp').hidden=true;
  history.replaceState(null,'',location.pathname+location.search+'#p1');
  render();toast('Prototipo reiniciado');
}

/* ---------- Teclado y gestos ---------- */
document.addEventListener('keydown',function(e){
  var t=e.target,typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);
  if(e.key==='Escape'){if(!$('#logp').hidden)$('#logp').hidden=true;else if(!$('#mod').hidden)$('#mod').hidden=true;else closeSheet();return;}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var inPanel=t&&t.closest&&t.closest('.panel');
  if(typing&&t.type!=='radio'&&t.type!=='checkbox'&&!inPanel)return;
  var k=e.key.toLowerCase();
  if(e.shiftKey&&k==='l'){e.preventDefault();toggleLog();}
  else if(e.shiftKey&&k==='r'){e.preventDefault();resetProto();}
  else if(!e.shiftKey&&k==='m'){e.preventDefault();toggleMod();}
});
var taps=[];
$('#band').addEventListener('click',function(){var n=Date.now();taps=taps.filter(function(x){return n-x<2000;});taps.push(n);if(taps.length>=5){taps=[];toggleMod();}});
window.addEventListener('pagehide',function(){
  if(cur)log('tiempo_pantalla',{ms:Date.now()-enteredAt},code(cur));
  if(task.t0&&!task.done)log('abandono',{motivo:'salida_pagina',pedido:task.order,ms:Date.now()-task.t0,pantallas:task.screens});
});

/* ---------- Arranque ---------- */
if(!R[location.hash.slice(1)])history.replaceState(null,'',location.pathname+location.search+'#p1');
render();
})();
</script>
