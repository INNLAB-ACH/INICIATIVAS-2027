<style>
:root{--navy:#0D1B2A;--blue:#005FA3;--blue-d:#004A80;--bg:#F3F6F9;--line:#D5E0EA;--muted:#4A5A6A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);font-family:'Source Sans 3',system-ui,sans-serif;font-size:16px;line-height:1.45}
header{background:var(--navy);color:#fff;padding:28px 20px}
header div,main{max-width:1100px;margin:0 auto}
h1,h2{font-family:'Manrope',system-ui,sans-serif;margin:0}
h1{font-size:28px}
header p{margin:6px 0 0;color:#C9D7E3}
main{padding:20px 20px 56px}
h2{font-size:19px;margin:28px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.card a.main{color:var(--blue-d);font-family:'Manrope',system-ui,sans-serif;font-weight:800;text-decoration:none;font-size:17px}
.card a.main:hover{text-decoration:underline}
.meta{color:var(--muted);font-size:14px}
.vars{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.vars a{font-size:13px;font-weight:700;color:var(--blue-d);background:#EAF2F8;border-radius:999px;padding:3px 10px;text-decoration:none}
.vars a:hover{background:#D5E6F2}
.tag{font-size:12px;font-weight:700;background:#E3F1E8;color:#1E7A46;border-radius:999px;padding:2px 8px;align-self:flex-start}
</style>
</head>
