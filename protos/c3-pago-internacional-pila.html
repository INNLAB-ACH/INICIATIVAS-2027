<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>C3 · Pago internacional PILA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0D1B2A;--blue:#005FA3;--blue-d:#004A80;--blue-l:#A8C4D8;--bg:#F3F6F9;
  --ink:#0D1B2A;--muted:#4A5A6A;--line:#D5E0EA;--field:#7D8E9F;
  --ok:#1E7A46;--ok-bg:#E3F1E8;--err:#B3261E;--err-bg:#FCE9E7;--warn:#7A4F00;--warn-bg:#FDF0D5;
  --us:#4B3F72;--us-d:#3A3059;--es:#7A4A12;--es-d:#5E390D;
  --hf:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);font-family:'Source Sans 3',system-ui,sans-serif;color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.flow{background:#DCE4EC}
h1,h2,h3{font-family:var(--hf);margin:0;line-height:1.2}
h1:focus,h2:focus{outline:none}
p{margin:0 0 10px}
button,input,select{font-family:inherit;font-size:16px;color:inherit}
:focus-visible{outline:3px solid var(--blue-d);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.band{background:var(--navy);color:#fff;font-size:12.5px;text-align:center;padding:7px 8px;letter-spacing:.02em;user-select:none}
.band.fixed{position:sticky;top:0;z-index:30}

/* ====== LANDING ====== */
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.lhead{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:33px;z-index:20}
.lhead .wrap{display:flex;align-items:center;gap:12px;min-height:64px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--hf);font-weight:800;font-size:17px;flex:1}
.logo .m{width:36px;height:36px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12px;letter-spacing:.04em}
.lnav{display:flex;gap:6px;align-items:center}
.lnav a{color:var(--ink);text-decoration:none;font-weight:600;padding:10px 12px;border-radius:8px;min-height:44px;display:inline-flex;align-items:center}
.lnav a:hover{background:#EDF2F6}
@media (max-width:720px){.lnav a.opt{display:none}}
.hero{padding:56px 0 48px;background:#fff;border-bottom:1px solid var(--line)}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;gap:32px}.hero{padding:36px 0}}
.eyebrow{display:inline-block;background:#EAF2F8;color:var(--blue-d);font-weight:700;font-size:14px;border-radius:20px;padding:4px 12px;margin-bottom:16px}
.hero h1{font-weight:800;font-size:clamp(32px,5vw,50px);letter-spacing:-.02em;margin-bottom:16px}
.hero .lead{font-size:clamp(17px,2vw,20px);color:var(--muted);max-width:560px;margin-bottom:24px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.note{font-size:14px;color:var(--muted);margin-top:14px}
.demo{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:22px}
.demo .stepc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.demo .lbl{font-size:13.5px;color:var(--muted)}
.demo .big{font-family:var(--hf);font-weight:800;font-size:26px}
.demo .arrow{display:flex;justify-content:center;padding:8px 0;color:var(--blue)}
.demo .okc{background:var(--ok-bg);border-color:#A9D3B8}
.sec{padding:56px 0}
.sec.alt{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sec h2{font-weight:800;font-size:clamp(26px,3.4vw,34px);margin-bottom:10px}
.sec .sub{color:var(--muted);font-size:18px;max-width:640px;margin-bottom:28px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:860px){.grid3{grid-template-columns:1fr}}
.ben{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
.sec.alt .ben{background:var(--bg)}
.ben .ic{width:46px;height:46px;border-radius:12px;background:#EAF2F8;color:var(--blue-d);display:grid;place-items:center;margin-bottom:14px}
.ben h3{font-size:19px;margin-bottom:6px}
.ben p{color:var(--muted);margin:0}
.stepn{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;font-family:var(--hf);font-weight:800;display:grid;place-items:center;margin-bottom:14px}
.price{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
@media (max-width:860px){.price{grid-template-columns:1fr}}
.pricebox{background:var(--navy);color:#fff;border-radius:20px;padding:28px}
.pricebox .from{font-size:16px;color:#C9D7E3}
.pricebox .val{font-family:var(--hf);font-weight:800;font-size:clamp(40px,6vw,56px);line-height:1.1;margin:6px 0}
.pricebox p{color:#C9D7E3;margin:0}
.ex{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.faq details{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.faq summary{cursor:pointer;list-style:none;padding:16px 20px;font-family:var(--hf);font-weight:700;font-size:17px;display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:56px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:24px;color:var(--blue);flex:none}
.faq details[open] summary::after{content:"−"}
.faq details p{padding:0 20px 16px;color:var(--muted);margin:0}
.formwrap{display:grid;grid-template-columns:.9fr 1.1fr;gap:40px;align-items:start}
@media (max-width:860px){.formwrap{grid-template-columns:1fr;gap:20px}}
.formcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px}
.lfoot{background:var(--navy);color:#C9D7E3;padding:28px 0;font-size:14px}
.lfoot strong{color:#fff}
.thanks{max-width:620px;margin:0 auto;padding:64px 20px;text-align:center}
.thanks h1{font-size:clamp(28px,4vw,38px);margin:16px 0 12px}

/* ====== FLUJO (marco de teléfono) ====== */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.phone{width:390px;height:844px;background:var(--bg);border-radius:46px;box-shadow:0 0 0 11px var(--navy),0 24px 70px rgba(13,27,42,.3);overflow:hidden;position:relative;display:flex;flex-direction:column}
.phone .band{padding-top:14px}
@media (max-width:520px),(max-height:700px) and (max-width:900px){
  .stage{padding:0;min-height:100dvh}
  .phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
  .phone .band{padding-top:max(7px,env(safe-area-inset-top))}
}
.screen{flex:1;overflow-y:auto;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.appbar{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px;min-height:58px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.appbar.us{background:var(--us);color:#fff;border-bottom:0}
.appbar.es{background:var(--es);color:#fff;border-bottom:0}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--hf);font-weight:800;font-size:16px;flex:1;min-width:0}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.soi{height:30px;padding:0 8px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12px;letter-spacing:.06em;flex:none}
.fbm{width:30px;height:30px;border-radius:8px;background:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.appbar.us .fbm{color:var(--us)}.appbar.es .fbm{color:var(--es)}
.back{min-width:44px;height:44px;border:0;background:transparent;border-radius:10px;cursor:pointer;color:inherit;display:flex;align-items:center;gap:2px;padding:0 8px 0 2px;font-weight:600;font-size:15px;flex:none}
.back:hover{background:rgba(0,95,163,.08)}
.appbar.us .back:hover,.appbar.es .back:hover{background:rgba(255,255,255,.14)}
.back-sp{width:4px}
.urlbar{font-size:12.5px;color:var(--muted);background:#EDF2F6;padding:5px 12px;display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--line)}
.content{padding:18px 16px 20px;flex:1}
.content h1{font-weight:800;font-size:23px;margin:4px 0 12px}
.content h2{font-weight:700;font-size:17px;margin:0 0 10px}
.footer{position:sticky;bottom:0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;z-index:4}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid #EDF2F6}
.row:last-child{border-bottom:0}
.row .k{color:var(--muted)}
.row .v{text-align:right;font-weight:600}
.row .v.strong{font-family:var(--hf);font-weight:800}
.row.sub .k{padding-left:12px;font-size:15px}
.row.tot{border-top:2px solid var(--line);border-bottom:0;margin-top:2px}
.muted{color:var(--muted)}
.small{font-size:14px}
.amount{font-family:var(--hf);font-weight:800;font-size:30px;letter-spacing:-.01em}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 0 8px}
.notice{background:#EAF2F8;border:1px solid var(--blue-l);border-radius:12px;padding:10px 12px;font-size:15px;margin-bottom:14px}
.chip{display:inline-block;font-size:12.5px;font-weight:700;border-radius:20px;padding:2px 10px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.info{background:#EAF2F8;color:var(--blue-d)}
.paybox{background:var(--navy);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.paybox .muted{color:#C9D7E3}
.paybox .row{border-color:rgba(255,255,255,.14)}
.paybox .row .k{color:#C9D7E3}
.disc{border:0;background:transparent;color:#fff;font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0;cursor:pointer;display:flex;align-items:center;gap:6px}
.disc svg{transition:transform .2s}
.disc[aria-expanded=true] svg{transform:rotate(180deg)}
.eq{font-size:13.5px;color:#C9D7E3;margin-top:6px}
.acct{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;padding:14px;margin:0 0 10px;cursor:pointer;background:#fff;font-weight:400}
.acct:has(input:checked){border-color:var(--blue);background:#F5F9FC;box-shadow:0 0 0 1.5px var(--blue)}
.acct input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--blue);flex:none}
.acct strong{display:block;font-family:var(--hf);font-size:16px}
.acct .d{display:block;color:var(--muted);font-size:14px}
.acct .t{display:block;font-family:var(--hf);font-weight:800;font-size:18px;margin-top:6px}

/* Botones y formularios (comunes) */
.btn{min-height:50px;border-radius:12px;font-family:var(--hf);font-weight:700;font-size:16px;border:0;cursor:pointer;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.phone .btn,.formcard .btn,.overlay .btn{width:100%}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-d)}
.btn-secondary{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.btn-secondary:hover{background:#EAF2F8}
.btn-us{background:var(--us);color:#fff}.btn-us:hover{background:var(--us-d)}
.btn-es{background:var(--es);color:#fff}.btn-es:hover{background:var(--es-d)}
.btn.sm{min-height:44px;width:auto!important;font-size:14px;padding:0 14px}
.link{background:none;border:0;color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:44px;cursor:pointer;padding:0 2px;font-size:15px}
.iconbtn{width:44px;height:44px;border:0;background:transparent;border-radius:10px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:#EDF2F6}
label{font-weight:600;display:block;margin:16px 0 6px}
fieldset{border:0;padding:0;margin:18px 0 0}
legend{font-weight:600;margin-bottom:8px;padding:0}
input[type=text],input[type=email],input[type=password],select{width:100%;min-height:50px;border:1.5px solid var(--field);border-radius:10px;padding:0 12px;background:#fff}
input[aria-invalid=true],select[aria-invalid=true]{border-color:var(--err);border-width:2px}
.hint{font-size:14px;color:var(--muted);margin-top:5px}
.err{color:var(--err);font-size:14.5px;margin-top:6px;font-weight:600}
.err:empty{display:none}
label.opt{display:flex;align-items:flex-start;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;min-height:48px;margin:0 0 8px;cursor:pointer;background:#fff;font-weight:600}
label.opt:has(input:checked){border-color:var(--blue);background:#F5F9FC}
label.opt input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--blue);flex:none}
label.opt.plain{font-weight:400}

/* Superposiciones */
.overlay{position:absolute;inset:0;background:rgba(243,246,249,.97);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px}
.overlay.fixed{position:fixed}
.ov-t{font-family:var(--hf);font-weight:800;font-size:19px;margin:16px 0 6px}
.overlay .btn{max-width:320px;margin-top:14px}
.spinner{width:46px;height:46px;border-radius:50%;border:4px solid var(--blue-l);border-top-color:var(--blue);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;z-index:70;text-align:center;font-weight:600}
.toast.fixed{position:fixed;left:50%;right:auto;transform:translateX(-50%);width:min(420px,calc(100% - 32px));bottom:24px}

/* Paneles del moderador */
.panel{position:fixed;inset:0;background:rgba(13,27,42,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.pbox{background:#fff;border-radius:16px;width:100%;max-width:620px;max-height:92vh;overflow:auto;padding:16px 20px 20px}
.pbox.wide{max-width:1100px}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.ph h2{margin:0;font-size:19px}
.pbox label.opt{align-items:center;padding:8px 12px}
.pbox h3{font-size:15px;margin:18px 0 8px}
.jumps{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.jumps button{min-height:44px;border:1.5px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;text-align:left;padding:4px 10px;font-size:14px}
.jumps button:hover{border-color:var(--blue)}
.pactions{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.cfg{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.cfg label{font-size:14px;margin:10px 0 4px}
.cfg input{min-height:44px}
table{border-collapse:collapse;width:100%}
.stats th,.stats td{border-bottom:1px solid #EDF2F6;padding:6px 8px;text-align:left;font-size:14px}
.logt th,.logt td{font-size:12.5px;padding:6px 8px;border-bottom:1px solid #EDF2F6;text-align:left;white-space:nowrap}
.logt td:last-child{white-space:normal;word-break:break-all;min-width:240px}
.logt thead th{position:sticky;top:0;background:#F5F9FC}
.logt-wrap{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.kbd{font-family:ui-monospace,monospace;background:#EDF2F6;border-radius:5px;padding:1px 6px;font-size:13px}
.state{background:#F5F9FC;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;margin:8px 0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<div id="landing" hidden></div>
<div id="flow" class="stage" hidden>
  <div class="phone" id="phone">
    <div class="band" id="band-f" role="note">Prototipo de investigación · datos ficticios</div>
    <main class="screen" id="screen"></main>
  </div>
</div>
<div id="ov" class="overlay" hidden></div>
<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
<div id="mod" class="panel" hidden></div>
<div id="logp" class="panel" hidden></div>

<script>
(function(){
'use strict';

/* ==========================================================
   CONFIGURACIÓN (editable). También se puede sobrescribir por URL:
   ?costo=3.49  ?tasa=4100  ?costo_eur=2.99  ?tasa_eur=4450
   ========================================================== */
var CONFIG={
  COSTO_USD:2.99,      /* costo del servicio por pago, en USD (se muestra en la landing como «desde USD X») */
  COSTO_EUR:2.79,      /* costo del servicio por pago desde España, en EUR */
  TASA_USD:4050,       /* pesos colombianos por 1 USD (ficticia) */
  TASA_EUR:4400        /* pesos colombianos por 1 EUR (ficticia) */
};
(function(){var q=new URLSearchParams(location.search);
  function num(k,def){var v=parseFloat(String(q.get(k)||'').replace(',','.'));return isFinite(v)&&v>0?v:def;}
  CONFIG.COSTO_USD=num('costo',CONFIG.COSTO_USD);CONFIG.TASA_USD=num('tasa',CONFIG.TASA_USD);
  CONFIG.COSTO_EUR=num('costo_eur',CONFIG.COSTO_EUR);CONFIG.TASA_EUR=num('tasa_eur',CONFIG.TASA_EUR);})();

/* ---------- Datos del escenario (ficticios) ---------- */
var PERSONA={name:'Diana Marcela Restrepo',doc:'CC •••• 4471',city:'Miami, EE. UU.'};
var INGRESO=5000000, IBC_PCT=0.40;
var APORTES=[{k:'Salud',pct:0.125},{k:'Pensión',pct:0.16}];
var PERIODO='octubre de 2026', LIMITE='17/11/2026';
var BANKS={
  us:{name:'Liberty Bank',cur:'USD',acct:'Cuenta corriente •••• 2208',country:'EE. UU.',cls:'us',host:'libertybank.ejemplo.com'},
  es:{name:'Banco Ibérico',cur:'EUR',acct:'Cuenta •••• 5530',country:'España',cls:'es',host:'bancoiberico.ejemplo.es'}
};
var LS_KEY='c3_pila_log', LS_WAIT='c3_lista_espera', LS_T='c3_titular', SK='c3_pila_estado';

/* ---------- Utilidades ---------- */
function $(s){return document.querySelector(s);}
function cop(n){return '$'+String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function r2(n){return Math.round(n*100)/100;}
function dec(n){var s=r2(n).toFixed(2).split('.');return s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+s[1];}
function fx(n,cur){return cur+' '+dec(n);}
function pad(n){return String(n).padStart(2,'0');}
function fdate(d){return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();}
function ftime(d){var h=d.getHours(),ap=h<12?'a. m.':'p. m.';h=h%12||12;return h+':'+pad(d.getMinutes())+' '+ap;}
function nextBizDay(d){var x=new Date(d);do{x.setDate(x.getDate()+1);}while(x.getDay()===0||x.getDay()===6);return x;}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function rnd(n){var s='';for(var i=0;i<n;i++)s+=Math.floor(Math.random()*10);return s.replace(/^0/,'9');}

/* ---------- Cálculo de la planilla (coherente de punta a punta) ---------- */
function planilla(){
  var ibc=Math.round(INGRESO*IBC_PCT);
  var items=APORTES.map(function(a){return {k:a.k,pct:a.pct,v:Math.round(ibc*a.pct)};});
  var totalCop=items.reduce(function(s,i){return s+i.v;},0);
  return {ibc:ibc,items:items,totalCop:totalCop};
}
/* Conversión: aportes en moneda extranjera = COP ÷ tasa (redondeado a centavos); total = aportes + costo del servicio */
function quote(cur){
  var p=planilla(),rate=cur==='EUR'?CONFIG.TASA_EUR:CONFIG.TASA_USD,fee=cur==='EUR'?CONFIG.COSTO_EUR:CONFIG.COSTO_USD;
  var aportes=r2(p.totalCop/rate);
  return {cur:cur,rate:rate,fee:fee,aportes:aportes,total:r2(aportes+fee),totalCop:p.totalCop};
}

/* ---------- Variante de la landing (titular) ---------- */
var TITULARES={1:'Cotiza a tu pensión en Colombia desde Estados Unidos',2:'Paga tu seguridad social en Colombia sin remesas'};
function getQ(){return new URLSearchParams(location.search);}
function titular(){

var io=null,seen={};
function observeSections(){
  if(io)io.disconnect();
  if(!('IntersectionObserver' in window))return;
  var order=['hero','beneficios','como_funciona','costo','faq','formulario'];
  io=new IntersectionObserver(function(es){es.forEach(function(en){if(!en.isIntersecting)return;var s=en.target.dataset.sec;
    if(!seen[s]){seen[s]=true;log('seccion_vista',{seccion:s,titular:T});if(order.indexOf(s)>order.indexOf(landing.maxSec))landing.maxSec=s;}});},{threshold:.35});
  [].forEach.call(document.querySelectorAll('[data-sec]'),function(s){io.observe(s);});
}
function scrollToForm(focus){var f=$('#lista');if(!f)return;f.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
  if(focus)setTimeout(function(){var p=$('#w-pais');if(p)p.focus({preventScroll:true});},450);}

/* --- Envío de la lista de espera ---
   Los datos se guardan SOLO en localStorage (clave «c3_lista_espera»). Nada sale a internet.
   PARA CONECTAR UN FORMULARIO REAL (por ejemplo Microsoft Forms):
   Microsoft Forms no recibe envíos directos desde otra página. La forma habitual es crear un flujo
   en Power Automate con el disparador «Cuando se recibe una solicitud HTTP», que agregue cada
   registro a una lista de Microsoft Lists / Excel (o lo reenvíe a Forms). Luego reemplaza el cuerpo de
   enviarRegistro() por algo como:
     fetch('https://URL-DEL-FLUJO-DE-POWER-AUTOMATE', {method:'POST',
       headers:{'Content-Type':'application/json'}, body:JSON.stringify(registro)});
   Conserva el campo «titular» para comparar la tasa de registro por variante. */
function enviarRegistro(registro){
  var list=[];try{list=JSON.parse(localStorage.getItem(LS_WAIT)||'[]');}catch(_){}
  list.push(registro);try{localStorage.setItem(LS_WAIT,JSON.stringify(list));}catch(_){}
}
function submitWait(e){
  e.preventDefault();
  var pais=$('#w-pais').value,cot=(document.querySelector('input[name=w-cotiza]:checked')||{}).value||'',
      paga=(document.querySelector('input[name=w-paga]:checked')||{}).value||'',email=$('#w-email').value.trim(),ok=$('#w-ok').checked,bad=[];
  function set(id,msg,inp){$('#'+id).textContent=msg;if(inp)$(inp).setAttribute('aria-invalid',msg?'true':'false');}
  set('e-pais',pais?'':'Elige el país donde vives.','#w-pais');if(!pais)bad.push('pais');
  set('e-cotiza',cot?'':'Elige una opción.');if(!cot)bad.push('cotiza');
  set('e-paga',paga?'':'Elige una opción.');if(!paga)bad.push('como_paga');
  var em=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
  set('e-email',em?'':(email?'Revisa el correo. Debe tener la forma nombre@correo.com':'Escribe tu correo electrónico.'),'#w-email');if(!em)bad.push('correo');
  set('e-ok',ok?'':'Para avisarte, necesitamos tu autorización.');if(!ok)bad.push('autorizacion');
  if(bad.length){vErr(bad);var map={pais:'#w-pais',cotiza:'input[name=w-cotiza]',como_paga:'input[name=w-paga]',correo:'#w-email',autorizacion:'#w-ok'};$(map[bad[0]]).focus();return;}
  var btn=e.target.querySelector('button[type=submit]');btn.disabled=true;
  busy('Guardando tu registro',1200,true).then(function(okk){btn.disabled=false;if(!okk)return;
    if(maybeFail('wait')){showError('No pudimos guardar tu registro','Revisa tu conexión e inténtalo de nuevo.');return;}
    var reg={ts:new Date().toISOString(),sesion:SID,titular:T,titular_texto:TITULARES[T],pais:pais,cotiza:cot,como_paga:paga,correo:email};
    enviarRegistro(reg);landing.registered=true;
    log('registro_enviado',{titular:T,pais:pais,cotiza:cot,como_paga:paga,campos_completados:Object.keys(landing.fields).length,ms_en_pagina:Date.now()-enteredAt});
    go('l3');});
}

function render(re){
  var r=location.hash.slice(1);
  if(r==='como'||r==='faq'||r==='lista'){return;} /* anclas internas de la landing */
  if(!R[r]&&!/^l[123]$/.test(r)){r=pagina()==='flujo'?'f1':'l1';history.replaceState(null,'',location.pathname+location.search+'#'+r);}
  tok++;hideOverlay();
  var isL=/^l/.test(r);
  if(!re){
    if(cur&&cur!==r){
      log('tiempo_pantalla',{ms:Date.now()-enteredAt},code(cur));
      if(isFlowAbandonable(cur)&&!/^f/.test(r))log('abandono',{en:code(cur),motivo:'salio_del_flujo'},code(cur));
      if(/^l[12]$/.test(cur)&&!/^l/.test(r)&&!landing.registered)log('abandono',{motivo:'salio_de_la_landing',titular:T,ultima_seccion:landing.maxSec,campos_completados:Object.keys(landing.fields)},code(cur));
    }
    var prevL=/^l/.test(cur||'');
    if(r==='f1'&&(!flowTask.t0||flowTask.done)){flowTask={t0:Date.now(),screens:0,errors:0,done:false};S.desglose=0;S.txn=null;save();var pc=cur;cur=r;log('inicio_tarea',null,'F1');cur=pc;}
    if(/^f/.test(r)&&flowTask.t0&&!flowTask.done)flowTask.screens++;
    if(r==='f4'&&S.txn&&S.txn.bank!==S.bank)S.txn=null;
    var sameLanding=isL&&prevL&&r!=='l3'&&cur!=='l3';
    cur=r;
    if(!sameLanding)enteredAt=Date.now();
    log('entrada_pantalla',isL?{titular:T}:null,code(r));
    if(isL&&!prevL)log('vista_landing',{titular:T,titular_texto:TITULARES[T]},code(r));
    if(sameLanding){if(r==='l2')scrollToForm(true);else window.scrollTo({top:0,behavior:'smooth'});return;}
  }
  $('#landing').hidden=!isL;$('#flow').hidden=isL;document.body.classList.toggle('flow',!isL);
  ovEl.classList.toggle('fixed',isL);toastEl.classList.toggle('fixed',isL);
  var host=isL?document.body:$('#phone');if(ovEl.parentNode!==host){host.appendChild(ovEl);host.appendChild(toastEl);}
  if(isL){renderLanding(r);window.scrollTo(0,0);
    if(r==='l2')setTimeout(function(){scrollToForm(true);},60);else{var h=document.querySelector('#landing h1');if(h)h.focus({preventScroll:true});}
    return;}
  var d=R[r]();
  screenEl.innerHTML=buildBar(d)+'<div class="content">'+d.body+'</div>'+(d.foot?'<div class="footer">'+d.foot+'</div>':'');
  screenEl.scrollTop=0;save();
  if(d.after)d.after();
  var h=screenEl.querySelector('h1');if(h){h.setAttribute('tabindex','-1');try{h.focus({preventScroll:true});}catch(_){h.focus();}}
}

  '<p id="copyMsg" class="small" role="status" style="color:var(--ok);font-weight:600"></p>'+
  (start?'<p class="small muted">Se muestran los últimos 600 eventos; el CSV incluye todos.</p>':'')+
  '<div class="logt-wrap"><table class="logt"><thead><tr>'+COLS.map(function(c){return '<th scope="col">'+c+'</th>';}).join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  var w=$('#logp .logt-wrap');if(w)w.scrollTop=w.scrollHeight;
}
function toggleLog(force){var p=$('#logp');if(p.hidden||force){renderLog();p.hidden=false;var b=p.querySelector('button');if(b)b.focus();}else p.hidden=true;}

/* ---------- Reinicio y abandono ---------- */
function logAbandon(motivo){
  if(isFlowAbandonable(cur)&&flowTask.t0&&!flowTask.done)log('abandono',{en:code(cur),motivo:motivo,ms:Date.now()-flowTask.t0,clics_desglose:S.desglose});
  if(/^l[12]$/.test(cur||'')&&!landing.registered)log('abandono',{motivo:motivo,titular:T,ultima_seccion:landing.maxSec,campos_completados:Object.keys(landing.fields)});
}
function resetProto(){
  logAbandon('reinicio');log('reinicio');
  S={bank:'us',forceErr:S.forceErr,failed:{},desglose:0,txn:null};try{sessionStorage.removeItem(SK);}catch(_){}
  SID='S'+Date.now().toString(36).toUpperCase();cur=null;seen={};landing={registered:false,maxSec:'',fields:{}};flowTask={t0:0,screens:0,errors:0,done:false};
  $('#mod').hidden=true;$('#logp').hidden=true;
  var start=pagina()==='flujo'?'f1':'l1';
  history.replaceState(null,'',location.pathname+location.search+'#'+start);
  render();toast('Prototipo reiniciado');
}
document.addEventListener('keydown',function(e){
  var t=e.target,typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);
  if(e.key==='Escape'){if(!$('#logp').hidden)$('#logp').hidden=true;else if(!$('#mod').hidden)$('#mod').hidden=true;return;}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var inPanel=t&&t.closest&&t.closest('.panel');
  if(typing&&t.type!=='radio'&&t.type!=='checkbox'&&!(inPanel&&t.type!=='text'))return;
  var k=e.key.toLowerCase();
  if(e.shiftKey&&k==='l'){e.preventDefault();toggleLog();}
  else if(e.shiftKey&&k==='r'){e.preventDefault();resetProto();}
  else if(!e.shiftKey&&k==='m'){e.preventDefault();toggleMod();}
});
var taps=[];
document.addEventListener('click',function(e){if(!e.target.closest('.band'))return;var n=Date.now();taps=taps.filter(function(x){return n-x<2000;});taps.push(n);if(taps.length>=5){taps=[];toggleMod();}});
window.addEventListener('pagehide',function(){if(cur)log('tiempo_pantalla',{ms:Date.now()-enteredAt},code(cur));logAbandon('salida_pagina');});

/* ---------- Arranque ---------- */
(function(){var h=location.hash.slice(1);
  if(!R[h]&&!/^l[123]$/.test(h))history.replaceState(null,'',location.pathname+location.search+'#'+(pagina()==='flujo'?'f1':'l1'));})();
render();
})();
</script>
