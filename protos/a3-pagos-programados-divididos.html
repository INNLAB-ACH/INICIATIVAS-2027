<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>A3 · Pagos programados y divididos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0D1B2A;--blue:#005FA3;--blue-d:#004A80;--blue-l:#A8C4D8;--bg:#F3F6F9;
  --ink:#0D1B2A;--muted:#4A5A6A;--line:#D5E0EA;--field:#7D8E9F;
  --ok:#1E7A46;--ok-bg:#E3F1E8;--err:#B3261E;--err-bg:#FCE9E7;--warn:#7A4F00;--warn-bg:#FDF0D5;
  --bank:#1E5E5A;--bank-d:#164845;
  --hf:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:#DCE4EC;font-family:'Source Sans 3',system-ui,sans-serif;color:var(--ink);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--hf);margin:0;line-height:1.2}
h1{font-weight:800;font-size:23px;margin:4px 0 12px}
h1:focus{outline:none}
h2{font-weight:700;font-size:17px;margin:0 0 10px}
h3{font-weight:700;font-size:15px;margin:18px 0 8px}
p{margin:0 0 10px}
button,input,select{font-family:inherit;font-size:16px;color:inherit}
:focus-visible{outline:3px solid var(--blue-d);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Escenario y marco */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.phone{width:390px;height:844px;background:var(--bg);border-radius:46px;box-shadow:0 0 0 11px var(--navy),0 24px 70px rgba(13,27,42,.3);overflow:hidden;position:relative;display:flex;flex-direction:column}
@media (max-width:520px),(max-height:700px) and (max-width:900px){
  .stage{padding:0;min-height:100dvh}
  .phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
}
.band{flex:none;background:var(--navy);color:#fff;font-size:12.5px;text-align:center;padding:14px 8px 7px;letter-spacing:.02em;user-select:none}
@media (max-width:520px){.band{padding-top:max(7px,env(safe-area-inset-top))}}
.screen{flex:1;overflow-y:auto;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch;position:relative}

/* Barras */
.appbar{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px;min-height:58px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.appbar.bank{background:var(--bank);color:#fff;border-bottom:0}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--hf);font-weight:800;font-size:16px;flex:1;min-width:0}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{min-width:44px;height:44px;border:0;background:transparent;border-radius:10px;cursor:pointer;color:inherit;display:flex;align-items:center;gap:2px;padding:0 8px 0 2px;font-weight:600;font-size:15px;flex:none}
.back:hover{background:rgba(0,95,163,.08)}
.appbar.bank .back:hover{background:rgba(255,255,255,.12)}
.back-sp{width:4px}
.bmark{width:30px;height:30px;border-radius:8px;background:var(--bank);color:#fff;display:grid;place-items:center;font-family:var(--hf);font-weight:800;font-size:15px;flex:none}
.appbar.bank .bmark{background:#fff;color:var(--bank)}
.urlbar{font-size:12.5px;color:var(--muted);background:#EDF2F6;padding:5px 12px;display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--line)}

/* Contenido */
.content{padding:18px 16px 20px;flex:1}
.footer{position:sticky;bottom:0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;z-index:4}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid #EDF2F6}
.row:last-child{border-bottom:0}
.row .k{color:var(--muted)}
.row .v{text-align:right;font-weight:600}
.row .v.strong{font-family:var(--hf);font-weight:800}
.muted{color:var(--muted)}
.small{font-size:14px}
.amount{font-family:var(--hf);font-weight:800;font-size:28px;letter-spacing:-.01em}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 0 8px}
.grow{flex:1;min-width:0}
.notice{background:#EAF2F8;border:1px solid var(--blue-l);border-radius:12px;padding:10px 12px;font-size:15px;margin-bottom:14px}
.notice.warn{background:var(--warn-bg);border-color:#E9C98A;color:#3D2A00}
.notice.ok{background:var(--ok-bg);border-color:#A9D3B8}
.chip{display:inline-block;font-size:12.5px;font-weight:700;border-radius:20px;padding:2px 10px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.off{background:#EDF2F6;color:var(--muted)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.info{background:#EAF2F8;color:var(--blue-d)}
.chip.err{background:var(--err-bg);color:var(--err)}

/* Menú de inicio */
.mod{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer;color:var(--ink)}
.mod:hover{border-color:var(--blue)}
.mod .ic{width:46px;height:46px;border-radius:12px;background:#EAF2F8;color:var(--blue-d);display:grid;place-items:center;margin-bottom:10px}
.mod strong{display:block;font-family:var(--hf);font-size:18px;margin-bottom:4px}
.mod .d{display:block;color:var(--muted);font-size:15px}
.mod .go{display:flex;align-items:center;justify-content:space-between;margin-top:10px;color:var(--blue);font-weight:700}

/* Facturas */
.bill{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer;font-weight:400}
.bill:has(input:checked){border-color:var(--blue);background:#F5F9FC}
.bill input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--blue);flex:none}
.bill .bic{width:40px;height:40px;border-radius:10px;background:#EAF2F8;color:var(--blue-d);display:grid;place-items:center;flex:none}
.bill strong{display:block;font-family:var(--hf);font-size:16px}
.bill .d{display:block;color:var(--muted);font-size:14px}
.bill .amt{font-family:var(--hf);font-weight:800;white-space:nowrap;text-align:right}
.bill.static{cursor:default}
.prog-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.prog-h strong{font-family:var(--hf);font-size:16px}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btnrow .btn{flex:1}
.hist{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #EDF2F6;font-size:15px}
.hist:last-child{border-bottom:0}
.hist .d{display:block;font-size:13px;color:var(--muted)}

/* Personas y montos */
.person{display:flex;gap:12px;align-items:center;border-bottom:1px solid #EDF2F6;padding:6px 0;min-height:56px;cursor:pointer;margin:0;font-weight:600}
.person:last-child{border-bottom:0}
.person input{width:22px;height:22px;margin:0;accent-color:var(--blue);flex:none}
.person .d{display:block;font-weight:400;color:var(--muted);font-size:14px}
.av{width:38px;height:38px;border-radius:50%;background:#EAF2F8;color:var(--blue-d);display:grid;place-items:center;font-family:var(--hf);font-weight:800;font-size:14px;flex:none}
.av.me{background:var(--navy);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.pchip{display:inline-flex;align-items:center;gap:4px;background:#EAF2F8;border-radius:22px;padding:0 4px 0 12px;font-size:14px;font-weight:600;min-height:36px}
.pchip button{width:32px;height:32px;border:0;background:transparent;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.pchip button:hover{background:#D5E0EA}
.share{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #EDF2F6;min-height:58px}
.share:last-child{border-bottom:0}
.share .nm{flex:1;min-width:0;font-weight:600}
.share .nm .d{display:block;font-weight:400;color:var(--muted);font-size:13.5px}
.share .val{font-family:var(--hf);font-weight:800;white-space:nowrap}
.share .money-in{flex:none;width:128px}
.share input{width:100%;min-height:46px;text-align:right;font-family:var(--hf);font-weight:700}
.sumbar{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:12px;padding:10px 12px;margin-top:8px;font-weight:600;font-size:15px}
.sumbar.ok{background:var(--ok-bg);color:var(--ok)}
.sumbar.bad{background:var(--err-bg);color:var(--err)}
.segs{display:flex;gap:8px}
.seg{position:relative;flex:1;margin:0}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:50px;border:1.5px solid var(--field);border-radius:12px;background:#fff;font-weight:700;font-family:var(--hf);font-size:15px;padding:0 6px}
.seg input:checked+span{background:var(--blue);border-color:var(--blue);color:#fff}
.seg input:focus-visible+span{outline:3px solid var(--blue-d);outline-offset:2px}
.progress{height:12px;background:#EDF2F6;border-radius:8px;overflow:hidden;margin:10px 0 6px}
.progress div{height:100%;background:var(--ok);border-radius:8px;transition:width .5s ease}
.btn-mini{min-height:44px;padding:0 14px;border-radius:10px;border:2px solid var(--blue);background:#fff;color:var(--blue);font-family:var(--hf);font-weight:700;cursor:pointer;font-size:14px;white-space:nowrap}
.btn-mini:hover{background:#EAF2F8}
.msg{background:#E7EEF4;border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:15px;text-align:left;margin:6px 0;max-width:300px}
.msg .lnk{color:var(--blue-d);text-decoration:underline;word-break:break-all}

/* Pantalla bloqueada (notificación) */
.lock{flex:1;background:var(--navy);color:#fff;padding:24px 16px;display:flex;flex-direction:column}
.clock{font-family:var(--hf);font-weight:800;font-size:56px;text-align:center;margin-top:12px;line-height:1}
.hdate{text-align:center;color:#C9D7E3;margin:6px 0 28px}
.notif{background:#fff;color:var(--ink);border-radius:18px;padding:12px 14px 14px;animation:drop .35s ease}
.notif-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:4px}
.notif-h strong{display:flex;gap:6px;align-items:center;color:var(--ink)}
.notif-h .bmark{width:22px;height:22px;border-radius:6px;font-size:12px}
.notif p{font-size:16px;margin:4px 0 12px}
.notif .acts{display:flex;gap:8px}
.notif .acts .btn{flex:1;min-height:46px;font-size:15px}
.lock .hint-l{margin-top:auto;text-align:center;color:#C9D7E3;font-size:14px}

/* Botones */
.btn{min-height:50px;border-radius:12px;font-family:var(--hf);font-weight:700;font-size:16px;border:0;cursor:pointer;width:100%;padding:0 16px}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-d)}
.btn-bank{background:var(--bank);color:#fff}
.btn-bank:hover{background:var(--bank-d)}
.btn-secondary{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.btn-secondary:hover{background:#EAF2F8}
.btn-danger{background:var(--err);color:#fff}
.btn-danger:hover{background:#8E1D17}
.btn-revoke{background:#fff;color:var(--err);border:2px solid var(--err)}
.btn-revoke:hover{background:var(--err-bg)}
.btn.sm{min-height:44px;width:auto;font-size:14px}
.link{background:none;border:0;color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:44px;cursor:pointer;padding:0 2px;font-size:15px}
.iconbtn{width:44px;height:44px;border:0;background:transparent;border-radius:10px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:#EDF2F6}

/* Formularios */
label{font-weight:600;display:block;margin:16px 0 6px}
fieldset{border:0;padding:0;margin:16px 0 0}
legend{font-weight:600;margin-bottom:8px;padding:0}
input[type=text],input[type=password],input[type=search],input[type=tel],select{width:100%;min-height:50px;border:1.5px solid var(--field);border-radius:10px;padding:0 12px;background:#fff}
input[aria-invalid=true]{border-color:var(--err);border-width:2px}
.hint{font-size:14px;color:var(--muted);margin-top:5px}
.err{color:var(--err);font-size:14.5px;margin-top:6px;font-weight:600}
.err:empty{display:none}
.warnmsg{color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:8px 10px;font-size:14.5px;margin-top:8px;font-weight:600}
.warnmsg:empty{display:none}
label.opt{display:flex;align-items:flex-start;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:12px;min-height:50px;margin:0 0 8px;cursor:pointer;background:#fff;font-weight:600}
label.opt:has(input:checked){border-color:var(--blue);background:#F5F9FC}
label.opt input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--blue);flex:none}
label.opt .d{display:block;font-weight:400;color:var(--muted);font-size:14px}
.inline-sel{display:flex;align-items:center;gap:8px;margin:4px 0 4px 34px}
.inline-sel select{width:auto;min-height:44px}
.money-in{position:relative}
.money-in span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--muted)}
.money-in input{padding-left:26px;font-family:var(--hf);font-weight:700}
.qchips{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.qchips button{min-height:44px;border:1.5px solid var(--line);background:#fff;border-radius:22px;padding:0 14px;cursor:pointer;font-weight:600;font-size:14px}
.qchips button:hover{border-color:var(--blue)}
.addnum{display:flex;gap:8px;align-items:flex-start}
.addnum input{flex:1}
.addnum .btn{width:auto;min-height:50px}

/* Superposiciones */
.overlay{position:absolute;inset:0;background:rgba(243,246,249,.97);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px}
.overlay.dark{background:var(--navy);color:#fff}
.overlay.dark .muted{color:#C9D7E3}
.ov-t{font-family:var(--hf);font-weight:800;font-size:19px;margin:16px 0 6px}
.overlay .btn{max-width:320px;margin-top:14px}
.spinner{width:46px;height:46px;border-radius:50%;border:4px solid var(--blue-l);border-top-color:var(--blue);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drop{from{transform:translateY(-16px);opacity:0}}
#sheetWrap{position:absolute;inset:0;z-index:40}
.backdrop{position:absolute;inset:0;background:rgba(13,27,42,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:#fff;border-radius:20px 20px 0 0;padding:8px 16px 20px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;background:#fff;padding-top:8px;z-index:1}
.sheet-h h2{margin:0}
.sheet ul{padding-left:20px;margin:8px 0 12px}
.sheet li{margin-bottom:8px}
.sheet .btn{margin-top:8px}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;z-index:70;text-align:center;font-weight:600}

/* Paneles del moderador */
.panel{position:fixed;inset:0;background:rgba(13,27,42,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.pbox{background:#fff;border-radius:16px;width:100%;max-width:600px;max-height:92vh;overflow:auto;padding:16px 20px 20px}
.pbox.wide{max-width:1100px}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.ph h2{margin:0;font-size:19px}
.pbox label.opt{align-items:center;padding:8px 12px}
.jumps{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.jumps button{min-height:44px;border:1.5px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;text-align:left;padding:4px 10px;font-size:14px}
.jumps button:hover{border-color:var(--blue)}
.pactions{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.logt th,.logt td{font-size:12.5px;padding:6px 8px;border-bottom:1px solid #EDF2F6;text-align:left;white-space:nowrap}
.logt td:last-child{white-space:normal;word-break:break-all;min-width:240px}
.logt thead th{position:sticky;top:0;background:#F5F9FC}
.logt-wrap{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
.kbd{font-family:ui-monospace,monospace;background:#EDF2F6;border-radius:5px;padding:1px 6px;font-size:13px}
.state{background:#F5F9FC;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;margin:8px 0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <div class="band" id="band" role="note">Prototipo de investigación · datos ficticios</div>
    <main class="screen" id="screen"></main>
    <div id="ov" class="overlay" hidden></div>
    <div id="sheetWrap" hidden><div class="backdrop" data-act="closeSheet"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"></div></div>
    <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
  </div>
</div>
<div id="mod" class="panel" hidden></div>
<div id="logp" class="panel" hidden></div>

<script>
(function(){
'use strict';

/* ---------- Datos del escenario (todo ficticio) ---------- */
var BILLS={
  energia:{name:'Energía Valle',ref:'Contrato 4471-0923',amount:148200,due:new Date(2026,10,15),ic:'bolt'},
  internet:{name:'Internet Hogar Net',ref:'Cuenta 88-301-554',amount:99900,due:new Date(2026,10,5),ic:'wifi'},
  colegio:{name:'Colegio San Mateo',ref:'Pensión · código 2019-337',amount:620000,due:new Date(2026,10,10),ic:'school'}
};
var BILL_IDS=['energia','internet','colegio'];
var ACCOUNTS={ahorros:{name:'Cuenta de ahorros •••• 4821',saldo:2318450},corriente:{name:'Cuenta corriente •••• 7730',saldo:640000}};
var TOTAL=480000;
var COMPRA={name:'Cabaña Los Guaduales',place:'Lago Calima, Valle del Cauca',dates:'14/11/2026 al 16/11/2026',ref:'DV-7F3K'};
var CONTACTS=[
  {id:'andres',name:'Andrés Rivas',phone:'300 ••• 4512'},{id:'camila',name:'Camila Ospina',phone:'311 ••• 0877'},
  {id:'julian',name:'Julián Mejía',phone:'315 ••• 2240'},{id:'mariana',name:'Mariana Torres',phone:'318 ••• 7745'},
  {id:'sebastian',name:'Sebastián Lozano',phone:'301 ••• 6618'},{id:'valentina',name:'Valentina Cruz',phone:'320 ••• 9031'}];
var PSE_BANKS=['Banco Andino','Banco del Pacífico Digital','Cooperativa Valle Unido'];
var SK='a3_pagos_prog_div_estado', LS_KEY='a3_pagos_prog_div_log';

/* ---------- Utilidades ---------- */
function $(s){return document.querySelector(s);}
function money(n){return (n<0?'−':'')+'$'+String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function digits(s){var d=String(s||'').replace(/\D/g,'');return d?parseInt(d,10):0;}
function fmtNum(n){return n?String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.'):'';}
function pad(n){return String(n).padStart(2,'0');}
function fdate(d){d=new Date(d);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();}
function fdm(d){d=new Date(d);return pad(d.getDate())+'/'+pad(d.getMonth()+1);}
function addDays(d,k){var x=new Date(d);x.setDate(x.getDate()+k);return x;}
function addMonth(d){var x=new Date(d);x.setMonth(x.getMonth()+1);return x;}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function avTxt(id,name){return id&&id.charAt(0)==='n'?'#':ini(name);}
function ini(name){return name.split(' ').map(function(w){return w.charAt(0);}).join('').slice(0,2).toUpperCase();}

/* ---------- Estado (persiste en la pestaña) ---------- */

/* ---------- Cálculos ---------- */
function payDate(id,p){var due=BILLS[id].due;return p.mode==='antes'?addDays(due,-p.days):new Date(due);}
function nextPay(id){var p=S.programs[id];var d=payDate(id,p);return p.skipped?addMonth(d):d;}
function dayText(p){return p.mode==='antes'?(p.days+(p.days===1?' día':' días')+' antes del vencimiento'):'En la fecha de vencimiento';}
function personById(id){
  for(var i=0;i<CONTACTS.length;i++)if(CONTACTS[i].id===id)return CONTACTS[i];
  for(var j=0;j<S.split.numbers.length;j++)if(S.split.numbers[j].id===id)return S.split.numbers[j];
  return {id:id,name:id,phone:''};
}
/* Reparto: devuelve [{id,name,amount,me}] cuya suma es SIEMPRE el total (o marca invalid) */
function shares(){
  var sp=S.split,others=sp.people.slice(),n=others.length+(sp.includeMe?1:0),out=[],sum=0;
  if(!n)return {list:[],valid:false,sum:0,diff:TOTAL};
  if(sp.mode==='iguales'){
    var base=Math.floor(TOTAL/n),rem=TOTAL-base*n;
    if(sp.includeMe){out.push({id:'me',name:'Tú',amount:base+rem,me:true});}
    others.forEach(function(id,i){var extra=(!sp.includeMe&&i===0)?rem:0;out.push({id:id,name:personById(id).name,amount:base+extra});});
  }else{
    var so=0;others.forEach(function(id){var a=sp.custom[id]||0;so+=a;out.push({id:id,name:personById(id).name,amount:a});});
    if(sp.includeMe)out.unshift({id:'me',name:'Tú',amount:TOTAL-so,me:true});
  }
  out.forEach(function(x){sum+=x.amount;});
  var valid=sum===TOTAL&&out.every(function(x){return x.amount>=0;})&&out.filter(function(x){return !x.me;}).every(function(x){return x.amount>0;});
  return {list:out,valid:valid,sum:sum,diff:TOTAL-sum};
}
function othersShares(){return shares().list.filter(function(x){return !x.me;});}
function pendingList(){return othersShares().filter(function(x){return !S.split.paid[x.id];});}

  var t=e.target,typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);
  if(e.key==='Escape'){if(!$('#logp').hidden)$('#logp').hidden=true;else if(!$('#mod').hidden)$('#mod').hidden=true;else closeSheet();return;}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var inPanel=t&&t.closest&&t.closest('.panel');
  if(typing&&t.type!=='radio'&&t.type!=='checkbox'&&!inPanel)return;
  var k=e.key.toLowerCase();
  if(e.shiftKey&&k==='l'){e.preventDefault();toggleLog();}
  else if(e.shiftKey&&k==='r'){e.preventDefault();resetProto();}
  else if(!e.shiftKey&&k==='m'){e.preventDefault();toggleMod();}
});
var taps=[];
$('#band').addEventListener('click',function(){var n=Date.now();taps=taps.filter(function(x){return n-x<2000;});taps.push(n);if(taps.length>=5){taps=[];toggleMod();}});
window.addEventListener('pagehide',function(){if(cur)log('tiempo_pantalla',{ms:Date.now()-enteredAt},code(cur));abandonAll('salida_pagina');});

/* ---------- Arranque ---------- */
if(!R[location.hash.slice(1)])history.replaceState(null,'',location.pathname+location.search+'#'+startRoute());
render();
})();
