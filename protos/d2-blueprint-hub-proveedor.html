<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>D2 · Blueprint Hub Open Finance · Proveedor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0D1B2A;--blue:#005FA3;--blue-d:#004A80;--blue-l:#A8C4D8;--bg:#F3F6F9;
  --ink:#0D1B2A;--muted:#4A5A6A;--line:#D5E0EA;--field:#7D8E9F;
  --ok:#1E7A46;--ok-bg:#E3F1E8;--err:#B3261E;--err-bg:#FCE9E7;--warn:#7A4F00;--warn-bg:#FDF0D5;
  --bank:#1E5E5A;--bank-d:#164845;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:#DCE4EC;font-family:'Source Sans 3',system-ui,sans-serif;color:var(--ink);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Manrope',system-ui,sans-serif;margin:0;line-height:1.2}
h1{font-weight:800;font-size:23px;margin:4px 0 12px}
h1:focus{outline:none}
h2{font-weight:700;font-size:17px;margin:0 0 10px}
h3{font-weight:700;font-size:15px;margin:16px 0 8px}
p{margin:0 0 10px}
button,input,select{font-family:inherit;font-size:16px;color:inherit}
:focus-visible{outline:3px solid var(--blue-d);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Escenario y marco */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.phone{width:390px;height:844px;background:var(--bg);border-radius:46px;box-shadow:0 0 0 11px var(--navy),0 24px 70px rgba(13,27,42,.3);overflow:hidden;position:relative;display:flex;flex-direction:column}
@media (max-width:520px),(max-height:700px) and (max-width:900px){
  .stage{padding:0;min-height:100dvh}
  .phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
}
.band{flex:none;background:var(--navy);color:#fff;font-size:12.5px;text-align:center;padding:7px 8px;letter-spacing:.02em;user-select:none;padding-top:max(7px,env(safe-area-inset-top))}
.phone:not(.full) .band{padding-top:14px}
.screen{flex:1;overflow-y:auto;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}

/* Barras */
.appbar{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px;min-height:58px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.appbar.bank{background:var(--bank);color:#fff;border-bottom:0}
.brand{display:flex;align-items:center;gap:8px;font-family:'Manrope',system-ui,sans-serif;font-weight:800;font-size:16px;flex:1;min-width:0}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{min-width:44px;height:44px;border:0;background:transparent;border-radius:10px;cursor:pointer;color:inherit;display:flex;align-items:center;gap:2px;padding:0 8px 0 2px;font-weight:600;font-size:15px}
.back:hover{background:rgba(0,95,163,.08)}
.appbar.bank .back:hover{background:rgba(255,255,255,.12)}
.back-sp{width:4px}
.lock{color:var(--muted);display:flex;align-items:center;gap:4px;font-size:13px}
.bmark{width:30px;height:30px;border-radius:8px;background:#fff;color:var(--bank);display:grid;place-items:center;font-size:15px;flex:none}
.pse{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:inline-grid;place-items:center;font-family:'Manrope',system-ui,sans-serif;font-weight:800;font-size:11.5px;letter-spacing:.03em;flex:none}

/* Contenido */
.content{padding:18px 16px 20px;flex:1}
.footer{position:sticky;bottom:0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;z-index:4}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card.total{display:flex;justify-content:space-between;align-items:center}
.row{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid #EDF2F6}
.row:last-child{border-bottom:0}
.row .k{color:var(--muted)}
.row .v{text-align:right;font-weight:600}
.row .v.strong{font-family:'Manrope',system-ui,sans-serif;font-weight:800}
.muted{color:var(--muted)}
.small{font-size:14px}
.amount{font-family:'Manrope',system-ui,sans-serif;font-weight:800;font-size:28px;letter-spacing:-.01em}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 0 8px}
.center-t{text-align:center}
.grow{flex:1;min-width:0}
.route{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.route .r{text-align:right}
.iata{font-family:'Manrope',system-ui,sans-serif;font-weight:800;font-size:24px}
.route-line{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--blue-l) 0 6px,transparent 6px 11px);position:relative}
.pm{display:flex;align-items:center;gap:12px;padding:10px;border:2px solid var(--blue);border-radius:12px;background:#F5F9FC}
.notice{background:#EAF2F8;border:1px solid var(--blue-l);border-radius:12px;padding:10px 12px;font-size:15px;margin-bottom:14px}
.notice.warn{background:var(--warn-bg);border-color:#E9C98A;color:#3D2A00}

/* Botones */
.btn{min-height:50px;border-radius:12px;font-family:'Manrope',system-ui,sans-serif;font-weight:700;font-size:16px;border:0;cursor:pointer;width:100%;padding:0 16px}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-d)}
.btn-bank{background:var(--bank);color:#fff}
.btn-bank:hover{background:var(--bank-d)}
.btn-secondary{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.btn-secondary:hover{background:#EAF2F8}
.btn.sm{min-height:44px;width:auto;font-size:14px}
.link{background:none;border:0;color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:44px;cursor:pointer;padding:0 2px;font-size:15px}
.iconbtn{width:44px;height:44px;border:0;background:transparent;border-radius:10px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:#EDF2F6}

/* Formularios */
label{font-weight:600;display:block;margin:16px 0 6px}
fieldset{border:0;padding:0;margin:14px 0 0}
legend{font-weight:600;margin-bottom:8px;padding:0}
input[type=text],input[type=email],input[type=password],input[type=search],input[inputmode=numeric],select{width:100%;min-height:50px;border:1.5px solid var(--field);border-radius:10px;padding:0 12px;background:#fff}
select{appearance:auto}
input[aria-invalid=true],select[aria-invalid=true]{border-color:var(--err);border-width:2px}
.hint{font-size:14px;color:var(--muted);margin-top:5px}
.err{color:var(--err);font-size:14.5px;margin-top:6px;font-weight:600}
.err:empty{display:none}
label.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:50px;margin:0 0 8px;cursor:pointer;background:#fff;font-weight:600}
label.opt:has(input:checked){border-color:var(--blue);background:#F5F9FC}
label.opt input{width:22px;height:22px;margin:0;accent-color:var(--blue);flex:none}
label.opt .d{display:block;font-weight:400;color:var(--muted);font-size:14px}
.segs{display:flex;gap:8px}
.seg{position:relative;flex:1;margin:0}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:flex;align-items:center;justify-content:center;min-height:50px;border:1.5px solid var(--field);border-radius:12px;background:#fff;font-weight:700;font-family:'Manrope',system-ui,sans-serif}
.seg input:checked+span{background:var(--blue);border-color:var(--blue);color:#fff}
.seg input:focus-visible+span{outline:3px solid var(--blue-d);outline-offset:2px}
.otp{font-family:'Manrope',system-ui,sans-serif;font-size:24px!important;letter-spacing:.35em;text-align:center}

/* Instrumentos */
.icard{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px 6px;margin-bottom:12px;cursor:pointer}
.icard.sel{border-color:var(--blue);box-shadow:0 0 0 1.5px var(--blue)}
.ic-head{display:flex;gap:12px;align-items:flex-start;margin:0;cursor:pointer}
.ic-head input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--blue);flex:none}
.ic-head strong{display:block;font-family:'Manrope',system-ui,sans-serif;font-size:16px}
.ic-head .d{display:block;font-weight:400;color:var(--muted);font-size:14px}
.saldo{font-size:14.5px;margin:8px 0 0 34px}
.icard label.sl{margin:10px 0 4px 34px;font-size:14px}
.icard select{width:calc(100% - 34px);margin-left:34px;min-height:46px}
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0 2px;padding:10px 0 0;border-top:1px solid #EDF2F6}
.metrics div{min-width:0}
.metrics dt{font-size:12.5px;color:var(--muted)}
.metrics dd{margin:0;font-weight:700;font-size:14.5px}
.icard .link{font-size:14px}

/* Tablas */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%}
.cmp th,.cmp td{padding:10px;border-bottom:1px solid #EDF2F6;text-align:left;vertical-align:top;font-size:14px;min-width:118px}
.cmp thead th{font-family:'Manrope',system-ui,sans-serif;font-size:13.5px;background:#F5F9FC}
.cmp th[scope=row]{position:sticky;left:0;background:#fff;color:var(--muted);font-weight:600;min-width:96px;box-shadow:1px 0 0 var(--line)}
.cmp thead th:first-child{position:sticky;left:0;z-index:1}
.btn-mini{min-height:44px;padding:0 14px;border-radius:10px;border:2px solid var(--blue);background:#fff;color:var(--blue);font-family:'Manrope',system-ui,sans-serif;font-weight:700;cursor:pointer}
.plan th,.plan td{padding:8px 10px;border-bottom:1px solid #EDF2F6;font-size:14.5px;text-align:left}
.plan td:last-child,.plan th:last-child{text-align:right}
.plan tfoot td{font-weight:700;border-bottom:0}
.eq{font-size:14px;color:var(--muted);margin-top:4px}

/* Ofertas y resultados */
.offer{border:2px solid var(--blue);background:#F5F9FC}
.result{background:var(--navy);color:#fff;border:0}
.result .row{border-color:rgba(255,255,255,.14)}
.result .row .k{color:#C9D7E3}
.result .eq{color:#C9D7E3}

/* Superposiciones */
.overlay{position:absolute;inset:0;background:rgba(243,246,249,.97);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px}
.ov-t{font-family:'Manrope',system-ui,sans-serif;font-weight:800;font-size:19px;margin:16px 0 6px}
.overlay .btn{max-width:320px;margin-top:14px}
.spinner{width:46px;height:46px;border-radius:50%;border:4px solid var(--blue-l);border-top-color:var(--blue);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fp{color:var(--blue)}
.fp path{stroke-dasharray:70;stroke-dashoffset:70;animation:draw 1.3s ease forwards}
.fp path:nth-child(2){animation-delay:.1s}.fp path:nth-child(3){animation-delay:.2s}.fp path:nth-child(4){animation-delay:.3s}.fp path:nth-child(5){animation-delay:.15s}.fp path:nth-child(6){animation-delay:.25s}
@keyframes draw{to{stroke-dashoffset:0}}
.fp-ring{width:132px;height:132px;border-radius:50%;background:#fff;border:2px solid var(--blue-l);display:grid;place-items:center;position:relative;overflow:hidden}
.fp-ring::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--blue);opacity:.55;top:10%;animation:scan 1.5s ease-in-out}
@keyframes scan{0%{top:10%}50%{top:88%}100%{top:10%}}
#sheetWrap{position:absolute;inset:0;z-index:40}
.backdrop{position:absolute;inset:0;background:rgba(13,27,42,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:86%;overflow-y:auto;background:#fff;border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet-h{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;padding-top:8px;z-index:1}
.sheet-h h2{margin:0}
.sheet ul{padding-left:20px;margin:8px 0 0}
.sheet li{margin-bottom:8px}
.bank-item{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;border:0;border-bottom:1px solid #EDF2F6;background:#fff;text-align:left;cursor:pointer;padding:4px 4px;font-weight:600}
.bank-item:hover{background:#F5F9FC}
.bank-item .av{width:34px;height:34px;border-radius:50%;background:#EAF2F8;color:var(--blue-d);display:grid;place-items:center;font-family:'Manrope',system-ui,sans-serif;font-weight:800;font-size:14px;flex:none}
.bank-item .cur{margin-left:auto;font-size:13px;color:var(--ok);font-weight:700}
.sms{position:absolute;top:44px;left:10px;right:10px;background:#fff;border-radius:16px;box-shadow:0 10px 34px rgba(13,27,42,.28);padding:10px 14px 4px;z-index:60;animation:drop .3s ease}
@keyframes drop{from{transform:translateY(-16px);opacity:0}}
.sms-h{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.sms p{margin:4px 0 0;font-size:15px}
.code{font-family:'Manrope',system-ui,sans-serif;letter-spacing:.12em}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;z-index:70;text-align:center;font-weight:600}

/* Paneles del moderador */
.panel{position:fixed;inset:0;background:rgba(13,27,42,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.pbox{background:#fff;border-radius:16px;width:100%;max-width:580px;max-height:92vh;overflow:auto;padding:16px 20px 20px}
.pbox.wide{max-width:1100px}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.ph h2{margin:0;font-size:19px}
.jumps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.jumps button{min-height:44px;border:1.5px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;text-align:left;padding:4px 10px;font-size:14px}
.jumps button:hover{border-color:var(--blue)}
.pactions{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.logt th,.logt td{font-size:12.5px;padding:6px 8px;border-bottom:1px solid #EDF2F6;text-align:left;white-space:nowrap}
.logt td:last-child{white-space:normal;word-break:break-all;min-width:240px}
.logt thead th{position:sticky;top:0;background:#F5F9FC}
.logt-wrap{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.kbd{font-family:ui-monospace,monospace;background:#EDF2F6;border-radius:5px;padding:1px 6px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}


/* ===== Extensiones del kit: escritorio, vistas duales y componentes comunes ===== */
:root{--amber:#B7791F;--plum:#5B3F8C}
.desk{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative}
.desk .band{padding-top:7px}
.desk .screen{overflow:visible;flex:1}
.wrapd{max-width:1280px;width:100%;margin:0 auto;padding:24px 28px 56px}
.wrapd.narrow{max-width:960px}
.dhead{background:#fff;border-bottom:1px solid var(--line)}
.dhead .in{max-width:1280px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:16px}
.dhead .brand{flex:none;flex:0 1 auto}
.dhead .sp{flex:1}
.dhead nav{display:flex;gap:4px;flex-wrap:wrap}
.dhead nav button{border:0;background:transparent;min-height:44px;padding:0 14px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted)}
.dhead nav button:hover{background:#EDF2F6}
.dhead nav button[aria-current=page]{background:#EAF2F8;color:var(--blue-d)}
.vbar{flex:none;display:flex;justify-content:center;gap:6px;padding:6px 10px;background:#fff;border-bottom:1px solid var(--line)}
.vbar button{min-height:40px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;cursor:pointer;font-family:'Manrope',system-ui,sans-serif;font-size:14px}
.vbar button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.side{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:900px){.grid2,.grid3,.grid4,.side{grid-template-columns:1fr}.wrapd{padding:16px}.dhead .in{flex-wrap:wrap;padding:10px 16px}}
.desk .card{padding:18px 20px}
.desk h1{font-size:28px;margin:4px 0 6px}
.lead{color:var(--muted);font-size:17px;margin:0 0 18px;max-width:70ch}
.eyebrow{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0 0 4px}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;background:#EAF2F8;color:var(--blue-d);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.err{background:var(--err-bg);color:var(--err)}
.badge.gray{background:#EDF2F6;color:var(--muted)}
.badge.plum{background:#EFE9F8;color:var(--plum)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:0 0 18px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;min-height:46px;padding:0 16px;font-weight:700;font-family:'Manrope',system-ui,sans-serif;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected=true]{color:var(--blue-d);border-bottom-color:var(--blue)}
.tabs button:hover{color:var(--ink)}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .n{font-family:'Manrope',system-ui,sans-serif;font-weight:800;font-size:26px;line-height:1.15}
.kpi .l{color:var(--muted);font-size:14px}
.dtable th,.dtable td{padding:11px 12px;border-bottom:1px solid #EDF2F6;text-align:left;font-size:15px;vertical-align:top}
.dtable thead th{background:#F5F9FC;font-family:'Manrope',system-ui,sans-serif;font-size:13.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dtable td.num,.dtable th.num{text-align:right;font-variant-numeric:tabular-nums}
.dtable tbody tr:hover{background:#FAFCFD}
.dtable tr.sel{background:#EAF2F8}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 18px 34px}
.tl li::before{content:"";position:absolute;left:10px;top:22px;bottom:-2px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .dot{position:absolute;left:0;top:2px;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--blue);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--blue)}
.tl .dot.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.tl .dot.wait{border-color:var(--field);color:var(--field)}
.tl .dot.warn{border-color:var(--amber);color:var(--amber)}
.tl h3{margin:0 0 2px;font-size:16px}
.stepper{display:flex;gap:6px;margin:0 0 16px}
.stepper i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.stepper i.on{background:var(--blue)}
.field{margin:0 0 14px}
.field>label{margin:0 0 5px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--field);border-radius:10px;padding:10px 12px;background:#fff;font-family:inherit;font-size:16px;resize:vertical}
input[type=number],input[type=date],input[type=tel],input[type=url]{width:100%;min-height:50px;border:1.5px solid var(--field);border-radius:10px;padding:0 12px;background:#fff}
input[type=range]{width:100%;accent-color:var(--blue)}
.switch{display:flex;align-items:center;gap:12px;min-height:50px;margin:0;font-weight:600;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--blue);margin:0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.toolbar .btn{width:auto}
.btn.sm{padding:0 14px}
.btn-ghost{background:transparent;color:var(--blue);border:0}
.btn-danger{background:#fff;color:var(--err);border:2px solid var(--err)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.banner{border-radius:12px;padding:12px 16px;margin:0 0 16px;background:#EAF2F8;border:1px solid var(--blue-l)}

.banner.warn{background:var(--warn-bg);border-color:#E9C98A}

.bar{height:10px;border-radius:5px;background:#E3EBF2;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue)}
.bar.ok>i{background:var(--ok)}.bar.warn>i{background:var(--amber)}.bar.err>i{background:var(--err)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:13.5px}

.note-side h3{margin:0 0 6px;font-size:14px;text-transform:uppercase;letter-spacing:.05em}
.survey{border:2px solid var(--plum);border-radius:14px;padding:14px 16px;background:#FAF7FE;margin-top:14px}
.survey h3{margin-top:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--field);background:#fff;font-weight:700;cursor:pointer}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.avatar{width:40px;height:40px;border-radius:50%;background:#EAF2F8;color:var(--blue-d);display:grid;place-items:center;font-family:'Manrope',system-ui,sans-serif;font-weight:800;flex:none}
.list{list-style:none;margin:0;padding:0}
.list>li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #EDF2F6}
.list>li:last-child{border-bottom:0}
.tabbar{flex:none;display:flex;border-top:1px solid var(--line);background:#fff;position:sticky;bottom:0;z-index:4}
.tabbar button{flex:1;min-height:56px;border:0;background:transparent;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabbar button[aria-current=page]{color:var(--blue-d)}
.desk .overlay{position:fixed;z-index:80}
.desk #sheetWrap{position:fixed;z-index:70}
.desk .sheet{left:50%;transform:translateX(-50%);bottom:auto;top:7vh;width:min(680px,94vw);border-radius:16px;max-height:86vh}
.desk .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;width:min(420px,92vw);right:auto}
.desk .sms{position:fixed;top:70px;right:20px;left:auto;width:360px}
.printable{background:#fff;border:1px solid var(--line);border-radius:6px;padding:28px 32px;box-shadow:0 2px 14px rgba(13,27,42,.08)}
.hasv .stage{min-height:calc(100vh - 53px)}
@media (max-width:520px),(max-height:700px) and (max-width:900px){.hasv .stage{min-height:calc(100dvh - 53px)}.hasv .phone{height:calc(100dvh - 53px)}}
.hasv .desk{min-height:calc(100vh - 53px)}
.desk .btn{width:auto;padding:0 28px}
.btn.block{width:100%}
.docnav{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.docnav .in{max-width:1280px;margin:0 auto;padding:6px 28px;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.docnav button{border:0;background:transparent;min-height:44px;padding:0 12px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted)}

.docsec{padding-top:28px;scroll-margin-top:64px}
.docsec>h2{font-size:22px;margin:0 0 4px}
.ilus{background:#FFF8E1;border:1px dashed #D9C36A;border-radius:6px;padding:1px 8px;font-size:12.5px;color:#6B5200;font-weight:700}
.desk .card{overflow-x:auto}

.bp{display:grid;grid-template-columns:150px repeat(6,minmax(140px,1fr));gap:6px;min-width:1000px}
.bp-h{font-family:'Manrope',system-ui,sans-serif;font-weight:700;font-size:13px;padding:6px 4px;align-self:end}
.bp-l{font-family:'Manrope',system-ui,sans-serif;font-weight:800;font-size:13.5px;display:flex;align-items:center;padding:4px;background:#EAF2F8;border-radius:10px}
.cell{position:relative;min-height:96px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 9px;font-size:13.5px;line-height:1.35;cursor:pointer}
.cell:hover{border-color:var(--blue)}
.cell.h1{background:#F5F9FC}.cell.h2{background:#FDF0D5;border-color:#E9C98A}.cell.h3{background:#FCE0DC;border-color:#E9A59C}

.cell .star{position:absolute;top:4px;right:7px;color:var(--blue);font-size:16px}

<body>
<div id="root"></div>
<style>#idx-back{position:fixed;top:4px;left:4px;z-index:200;font:700 12px/1 "Source Sans 3",system-ui,sans-serif;color:#fff;background:rgba(13,27,42,.88);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 10px;text-decoration:none;min-height:24px;display:inline-flex;align-items:center}#idx-back:hover,#idx-back:focus-visible{background:#005FA3}</style><a id="idx-back" href="index.html" aria-label="Volver al índice de prototipos">&larr; Índice</a>
<div id="mod" class="panel" hidden></div>
<div id="logp" class="panel" hidden></div>
<script>
/* ===== Kit de prototipos ACH: router por hash, registro, panel del moderador, estados ===== */
var K=(function(){
'use strict';
var cfg,S,SID,cur=null,enteredAt=0,tok=0,retryFn=null,lastFocus=null,shell=null,root,screenEl,ovEl;

/* ---------- Utilidades ---------- */
function $(s){return document.querySelector(s);}
function money(n){var neg=n<0;return (neg?'-':'')+'$'+String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function pad(n){return String(n).padStart(2,'0');}
function fdate(d){return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();}
function ftime(d){return pad(d.getHours())+':'+pad(d.getMinutes());}
function pct(x,dec){return (x*100).toFixed(dec==null?1:dec).replace('.',',')+' %';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
function rnd(n){var s='';for(var i=0;i<n;i++)s+=Math.floor(Math.random()*10);return s.replace(/^0/,'7');}
function plural(n,a,b){return n===1?a:b;}

/* ---------- Íconos ---------- */
var I={
  back:'<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  lock:'<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
  ok:'<svg width="68" height="68" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#E3F1E8"/><path d="M14 25l7 7 13-15" fill="none" stroke="#1E7A46" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  alert:'<svg width="68" height="68" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#FDF0D5"/><path d="M24 13v14" stroke="#7A4F00" stroke-width="3.5" stroke-linecap="round"/><circle cx="24" cy="34" r="2.4" fill="#7A4F00"/></svg>',
  close:'<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
  check:'<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  info:'<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="7.5" r="1.4" fill="currentColor"/></svg>',
  download:'<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  doc:'<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z M14 3v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
  bell:'<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4z M10 21h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
  chev:'<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  fp:'<svg class="fp" viewBox="0 0 64 64" width="92" height="92" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 28a20 20 0 0 1 40 0"/><path d="M19 44c-2-4-3-8-3-12a16 16 0 0 1 32 0c0 2 0 3-.2 5"/><path d="M25 49c-2-5-3-10-3-16a10 10 0 0 1 20 0c0 5-.5 10-2 14"/><path d="M32 33c0 7-1 13-4 18"/><path d="M37 35c0 6-1 11-3 16"/><path d="M46 42c-.4 3-1 6-2 9"/></g></svg>'
};
function mark(txt,bg,fg){return '<span class="avatar" aria-hidden="true" style="width:34px;height:34px;font-size:14px;'+(bg?'background:'+bg+';':'')+(fg?'color:'+fg+';':'')+'">'+esc(txt)+'</span>';}
function row(k,v,strong){return '<div class="row"><span class="k">'+k+'</span><span class="v'+(strong?' strong':'')+'">'+v+'</span></div>';}

/* ---------- Parámetros de URL y estado ---------- */
function readParams(){
  var q=new URLSearchParams(location.search),p={};
  (cfg.params||[]).forEach(function(d){
    var v=q.get(d.k);v=v==null?d.def:v;
    var ok=d.opts.some(function(o){return String(o[0]).toLowerCase()===String(v).toLowerCase();});
    if(ok){d.opts.forEach(function(o){if(String(o[0]).toLowerCase()===String(v).toLowerCase())v=o[0];});}else v=d.def;
    p[d.k]=v;
  });
  return p;
}
function freshState(prev){
  var s={p:readParams(),forceErr:prev?prev.forceErr:false,failed:{},task:{t0:0,screens:0,errors:0,done:false}};
  if(cfg.state){var x=cfg.state(s.p);for(var k in x)s[k]=x[k];}
  return s;
}
function startRoute(){return cfg.start(S.p);}
function vlabel(){var p=S.p,o=[];for(var k in p)o.push(k+'='+p[k]);return o.join('&')||'-';}

/* ---------- Registro de eventos ---------- */
var COLS=['ts','sesion','variante','pantalla','accion','detalle'];
function code(r){return (cfg.codes&&cfg.codes[r])||String(r||'').toUpperCase();}
function log(accion,detalle,pantalla){
  var e={ts:new Date().toISOString(),sesion:SID,variante:vlabel(),pantalla:pantalla||code(cur),accion:accion,
    detalle:detalle==null?'':(typeof detalle==='string'?detalle:JSON.stringify(detalle))};
  window.__log.push(e);
  try{localStorage.setItem(cfg.ls,JSON.stringify(window.__log));}catch(_){}
  if($('#logp')&&!$('#logp').hidden)renderLog();
}
function vErr(campos){S.task.errors++;log('error_validacion',{campos:campos});}
function complete(det){
  if(S.task.t0&&!S.task.done){S.task.done=true;log('tarea_completada',Object.assign({ms:Date.now()-S.task.t0,pantallas:S.task.screens,errores:S.task.errors},det||{}));}
}

/* ---------- Estructura (marco de teléfono o escritorio) ---------- */
var OVS='<div id="ov" class="overlay" hidden></div><div id="sheetWrap" hidden><div class="backdrop" data-act="closeSheet"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div><div id="sms" class="sms" hidden role="status" aria-live="polite"></div><div id="toast" class="toast" hidden role="status" aria-live="polite"></div>';
function buildShell(l){
  var band='<div class="band" id="band" role="note">Prototipo de investigación · datos ficticios</div>';
  var vb=cfg.views?'<div class="vbar" id="vbar" role="group" aria-label="Vista del prototipo">'+cfg.views.map(function(v,i){return '<button data-act="'+(v.act||'nav')+'" data-to="'+v.to+'" data-vi="'+i+'" aria-pressed="false">'+esc(v.label)+'</button>';}).join('')+'</div>':'';
  root.className=cfg.views?'hasv':'';
  root.innerHTML=vb+(l==='phone'?
    '<div class="stage"><div class="phone" id="phone">'+band+'<main class="screen" id="screen"></main>'+OVS+'</div></div>':
    '<div class="desk" id="phone">'+band+'<main class="screen" id="screen"></main>'+OVS+'</div>');
  shell=l;screenEl=$('#screen');ovEl=$('#ov');
  var taps=[];
  $('#band').addEventListener('click',function(){var n=Date.now();taps=taps.filter(function(x){return n-x<2000;});taps.push(n);if(taps.length>=5){taps=[];toggleMod();}});
}
function syncViews(r){
  if(!cfg.views)return;
  var act=-1;cfg.views.forEach(function(v,i){if(act<0&&(v.on?v.on(r):new RegExp(v.re).test(r)))act=i;});
  root.querySelectorAll('#vbar button').forEach(function(b){b.setAttribute('aria-pressed',String(+b.dataset.vi===act));});
}

/* ---------- Barras reutilizables ---------- */
function appbar(o){
  var back=o.back?'<button class="back" data-act="back" data-to="'+o.back+'">'+I.back+'<span>Atrás</span></button>':'<span class="back-sp"></span>';
  return '<header class="appbar'+(o.cls?' '+o.cls:'')+'">'+back+'<div class="brand">'+(o.mark||'')+'<span>'+o.title+'</span></div>'+(o.right||'')+'</header>';
}
function dhead(o){
  var nav=(o.nav||[]).map(function(n){return '<button data-act="nav" data-to="'+n.to+'"'+(n.cur?' aria-current="page"':'')+'>'+esc(n.label)+'</button>';}).join('');
  return '<header class="dhead"><div class="in"><div class="brand">'+(o.mark||'')+'<span>'+o.title+'</span></div>'+(nav?'<nav aria-label="Secciones">'+nav+'</nav>':'')+'<span class="sp"></span>'+(o.right||'')+'</div></header>';
}

/* ---------- Router ---------- */
function go(r){if(location.hash==='#'+r)render();else location.hash=r;}
function rerender(){render(true);}
function render(re){
  var r=location.hash.slice(1);
  if(!cfg.routes[r]){r=startRoute();history.replaceState(null,'',location.pathname+location.search+'#'+r);}
  tok++;
  if(!re){
    if(cur&&cur!==r)log('tiempo_pantalla',{ms:Date.now()-enteredAt},code(cur));
    if(!S.task.t0||S.task.done){S.task={t0:Date.now(),screens:0,errors:0,done:false};S.failed={};log('inicio_tarea',{desde:code(r)},code(r));}
    S.task.screens++;cur=r;enteredAt=Date.now();
  }
  var y0=window.scrollY,st0=screenEl?screenEl.scrollTop:0;
  var d=cfg.routes[r](r);
  var l=d.layout||cfg.layout||'phone';
  if(l!==shell)buildShell(l);
  hideOverlay();closeSheet(true);hideSms();syncViews(r);
  var wrap=d.wrap||(l==='phone'?'content':'wrapd');
  var body=wrap==='none'?d.body:'<div class="'+wrap+'">'+d.body+'</div>';
  screenEl.innerHTML=(d.bar||'')+body+(d.foot?'<div class="footer">'+d.foot+'</div>':'');
  if(!re){screenEl.scrollTop=0;window.scrollTo(0,0);log('entrada_pantalla',null,code(r));}
  else{screenEl.scrollTop=st0;window.scrollTo(0,y0);}
  if(d.after)d.after();
  var h=re?null:screenEl.querySelector('h1');if(h){h.setAttribute('tabindex','-1');try{h.focus({preventScroll:true});}catch(_){h.focus();}}
}

/* ---------- Estados: carga, error, avisos ---------- */
function ov(html){ovEl.innerHTML=html;ovEl.hidden=false;}
function hideOverlay(){if(ovEl){ovEl.hidden=true;ovEl.innerHTML='';}}
function busy(msg,ms){var t=tok;
  ov('<div class="spinner" aria-hidden="true"></div><p class="ov-t" role="status">'+msg+'</p><p class="muted small">Esto toma solo unos segundos.</p>');
  return new Promise(function(res){setTimeout(function(){if(t!==tok){res(false);return;}hideOverlay();res(true);},ms||1200);});}
function maybeFail(k){if(S.forceErr&&!S.failed[k]){S.failed[k]=true;return true;}return false;}
function showError(title,msg,retry,label){
  S.task.errors++;log('error_sistema',{mensaje:title});retryFn=retry||null;
  ov(I.alert+'<h2 class="ov-t" role="alert">'+title+'</h2><p class="muted">'+msg+'</p><button class="btn btn-primary" data-act="ovRetry">'+(label||'Intentar de nuevo')+'</button>');
  var b=ovEl.querySelector('button');if(b)b.focus();
}
function fingerprint(){var t=tok;
  ov('<div class="fp-ring">'+I.fp+'</div><p class="ov-t" role="status">Pon tu dedo en el sensor</p><p class="muted small">Verificación biométrica simulada</p>');
  return new Promise(function(res){setTimeout(function(){if(t!==tok){res(false);return;}hideOverlay();res(true);},1500);});}
function toast(msg){var el=$('#toast');if(!el)return;el.textContent=msg;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){el.hidden=true;},2600);}
function sms(html){var el=$('#sms');el.innerHTML='<div class="sms-h"><strong>Mensajes · SMS simulado</strong><span>ahora</span></div><p>'+html+'</p><button class="link" data-act="hideSms">Cerrar aviso</button>';el.hidden=false;}
function hideSms(){var e=$('#sms');if(e)e.hidden=true;}
function openSheet(html){lastFocus=document.activeElement;$('#sheet').innerHTML=html;$('#sheetWrap').hidden=false;var f=$('#sheet').querySelector('input,button');if(f)f.focus();}
function closeSheet(silent){var w=$('#sheetWrap');if(!w||w.hidden)return;w.hidden=true;$('#sheet').innerHTML='';if(!silent&&lastFocus&&lastFocus.focus)lastFocus.focus();}
function sheetHead(t){return '<div class="sheet-h"><h2 id="sh-t">'+t+'</h2><button class="iconbtn" data-act="closeSheet" aria-label="Cerrar">'+I.close+'</button></div>';}
function html(id,h){var e=document.getElementById(id);if(e)e.innerHTML=h;}
function copy(t,msg){function ok(){toast(msg||'Copiado');}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,function(){fallbackCopy(t);ok();});}else{fallbackCopy(t);ok();}}
function notesBox(t){var v='';try{v=localStorage.getItem(cfg.ls+'_notes')||'';}catch(_){}return '<div class="note-side"><h3>'+(t||'Notas del entrevistador')+'</h3><textarea data-inp="_note" aria-label="Notas del entrevistador">'+esc(v)+'</textarea><p class="hint"><button class="link" data-act="copyNotes">Copiar notas</button> · se guardan solo en este navegador</p></div>';}
function setTxt(id,t){var e=document.getElementById(id);if(e)e.textContent=t;}
function setErr(id,msg,inputId){setTxt(id,msg);if(inputId){var i=document.getElementById(inputId);if(i)i.setAttribute('aria-invalid',msg?'true':'false');}}
function download(name,text,mime){
  log('descarga',{archivo:name});
  try{var b=new Blob([text],{type:mime||'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);}catch(_){}
}

/* ---------- Panel del moderador (tecla M) ---------- */
function groups(){return typeof cfg.groups==='function'?cfg.groups(S.p):cfg.groups||[];}
function renderMod(){
  function r(name,val,lab,chk){return '<label class="opt"><input type="radio" name="'+name+'" value="'+esc(val)+'"'+(chk?' checked':'')+'> '+lab+'</label>';}
  var ps=(cfg.params||[]).map(function(d){return '<fieldset><legend>'+d.label+'</legend>'+d.opts.map(function(o){return r('mp_'+d.k,o[0],o[1],String(S.p[d.k])===String(o[0]));}).join('')+'</fieldset>';}).join('');
  var links=(cfg.params||[]).map(function(d){return d.opts.map(function(o){return '<span class="kbd">?'+d.k+'='+esc(o[0])+'</span>';}).join(' · ');}).join(' · ');
  $('#mod').innerHTML='<div class="pbox" role="dialog" aria-modal="true" aria-labelledby="mod-t">'+
  '<div class="ph"><h2 id="mod-t">Panel del moderador</h2><button class="iconbtn" data-act="closeMod" aria-label="Cerrar">'+I.close+'</button></div>'+
  '<p class="small muted">'+esc(cfg.title)+' · Sesión '+SID+' · '+esc(vlabel())+'</p>'+ps+
  '<label class="opt" style="margin-top:12px"><input type="checkbox" id="m-err"'+(S.forceErr?' checked':'')+'> Simular un error recuperable la primera vez en cada paso crítico</label>'+
  '<button class="btn btn-primary" data-act="modStart" style="margin-top:6px">Aplicar e iniciar desde el principio</button>'+
  groups().map(function(g){return '<h3>'+g[0]+'</h3><div class="jumps">'+g[1].map(function(k){return '<button data-act="jump" data-r="'+k+'">'+esc((cfg.labels&&cfg.labels[k])||k)+' <span class="muted">#'+k+'</span></button>';}).join('')+'</div>';}).join('')+

function onClick(e){

}
function onKey(e){
  var t=e.target,typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);
  if(e.key==='Escape'){if(!$('#logp').hidden)$('#logp').hidden=true;else if(!$('#mod').hidden)$('#mod').hidden=true;else closeSheet();return;}
  if(e.ctrlKey||e.metaKey||e.altKey)return;

  if(e.shiftKey&&k==='l'){e.preventDefault();toggleLog();}

}

return api;
})();

  '<section class="docsec" id="b3"><h2>Qué hace ACH y qué hace la entidad</h2><div class="card" style="padding:6px 16px"><table class="dtable" style="width:100%"><thead><tr><th>Responsabilidad</th><th>ACH</th><th>Entidad</th></tr></thead><tbody>'+
   RESP.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+(r[1]==='ach'?'<span class="badge ok">'+I.check+' Lo opera ACH</span>':r[1]?esc(r[1]):'—')+'</td><td>'+(r[2]==='ent'?'<span class="badge warn">'+I.check+' La entidad</span>':r[2]?esc(r[2]):'—')+'</td></tr>';}).join('')+'</tbody></table></div></section>'+
  '<section class="docsec" id="b4"><h2>Implementación por fases</h2><p class="muted">Rangos de ejemplo para '+e.n+'. Puedes editarlos para ajustarlos a su realidad.</p><div class="card" id="ph">'+phHtml()+'</div></section>'+
  '<section class="docsec" id="b5"><h2>Modelo de precio tentativo <span class="ilus">ilustrativo</span></h2><p class="muted">Cuota de implementación + mensualidad + costo por consulta con descuento por volumen. Tramos: '+TIERS.map(function(t){return t[2];}).join(' · ')+'. Costo base por consulta: '+money(e.call)+'.</p><div class="card" id="sim">'+simHtml()+'</div></section>'+
  '<section class="docsec" id="b6"><h2>Comparación de alternativas</h2><p class="muted">Una mirada neutral de tres caminos para cumplir como proveedor de datos.</p><div class="tscroll"><table class="dtable"><thead><tr><th></th>'+ALTS.map(function(a){return '<th>'+a.n+'</th>';}).join('')+'</tr></thead><tbody>'+
   ALT_ROWS.map(function(r){return '<tr><th scope="row" style="font-weight:600;color:var(--muted)">'+r[0]+'</th>'+ALTS.map(function(a){return '<td>'+esc(a.d[r[1]])+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>'+
  '<div class="survey"><h3>Ejercicio: ordene las alternativas de la más a la menos atractiva para su entidad</h3><div id="rank">'+rankHtml()+'</div><div class="toolbar"><button class="btn btn-primary sm" data-act="saveRank">Registrar orden</button>'+(S.ranked?'<span class="badge ok">'+I.check+' Orden registrado</span>':'')+'</div>'+
  '<label for="why">¿Por qué?</label><textarea id="why" data-inp="why" placeholder="Explique su orden">'+esc(S.why)+'</textarea></div></section>'+
  '<section class="docsec" id="b7"><h2>Próximos pasos</h2><div class="side"><div class="card"><ol><li>Sesión técnica con su equipo de arquitectura y seguridad.</li><li>Estimación conjunta del alcance y del volumen de consultas.</li><li>Propuesta comercial definitiva y plan de pruebas.</li></ol></div>'+K.notesBox()+'</div></section></div>';
  return h;
}

K.run({
  id:'d2',title:'D2 · Blueprint Hub Open Finance · Proveedor',layout:'desk',
  params:[{k:'ent',label:'Tipo de entidad',def:'banco',opts:[['banco','Banco mediano'],['coop','Cooperativa'],['neo','Neobanco']]}],
  state:initState,start:function(){return 'doc';},
  labels:{doc:'Documento completo'},groups:[['Pantalla',['doc']]],
  routes:{doc:function(){return {layout:'desk',wrap:'none',body:page()};}},
  acts:{
    setEnt:function(el){setEnt(el.dataset.id);},
    cell:function(el){cellSheet(el.dataset.id);},
    mark:function(el){var S=K.S,k=el.dataset.id;if(S.marks[k]){delete S.marks[k];}else S.marks[k]=1;
      var p=k.split('-');K.log('marca_mayor_carga',{carril:LANES[+p[0]],momento:MOMS[+p[1]],marcada:!!S.marks[k]});K.closeSheet();K.rerender();},
    rank:function(el){var S=K.S,i=S.rank.indexOf(el.dataset.id),j=i+(+el.dataset.d);if(j<0||j>2)return;var t=S.rank[i];S.rank[i]=S.rank[j];S.rank[j]=t;S.ranked=false;K.rerender();},
    saveRank:function(){var S=K.S;S.ranked=true;K.log('ranking_alternativas',{orden:S.rank.join(' > ')});K.rerender();}
  },
  inps:{
    ent:function(el,ty){if(ty==='change')setEnt(el.value);},
    heat:function(el,ty){if(ty!=='change')return;K.S.heat=el.checked;K.log('carga_visible',{visible:el.checked});K.rerender();},
    vol:function(el,ty){var S=K.S;S.vol=+el.value;K.setTxt('vol-l',fmtN(S.vol));K.html('sim-out',simOut());if(ty==='change')K.log('simulador_volumen',{volumen:S.vol,costo_mensual:Math.round(calc(S.vol).month)});},
    ph:function(el,ty){var S=K.S,v=Math.max(1,Math.min(52,+el.value||1));S.ph[+el.dataset.i][+el.dataset.k]=v;if(ty==='change'){K.log('fase_editada',{fase:PHASES[+el.dataset.i][0],k:el.dataset.k==='0'?'min':'max',semanas:v});K.rerender();}},
    why:function(el,ty){K.S.why=el.value;if(ty==='change')K.log('justificacion_ranking',{caracteres:el.value.length});}
  }
});

})();
</script>
